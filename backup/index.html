      init() {
        this.updateCartBadge();
        this.autoDetectUserLocation(() => {
          this.navigateTo('home');
        });
      }

     autoDetectUserLocation(callback) {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              this.currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
              try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();
                
                if (data && data.address) {
                  const countryCode = (data.address.country_code || '').toUpperCase();
                  const detectedCity = data.address.city || data.address.town || data.address.village || data.address.state || '';
                  const detectedSub = data.address.suburb || data.address.neighbourhood || data.address.quarter || data.address.district || data.address.road || '';

                  if (this.countryData[countryCode]) {
                    this.currentCountry = countryCode;
                  }

                  if (detectedCity) {
                    if (detectedCity.toLowerCase().includes('yaound')) this.currentCity = 'Yaoundé';
                    else if (detectedCity.toLowerCase().includes('douala')) this.currentCity = 'Douala';
                    else this.currentCity = detectedCity;
                  }

                  if (detectedSub) {
                    this.currentDistrict = detectedSub;
                    const districtInput = document.getElementById('district-input');
                    if (districtInput) districtInput.value = detectedSub; // Met à jour l'UI en direct
                  }
                }
              } catch (e) {
                console.warn("Erreur ou timeout géocodage inverse", e);
              }

              this.syncHeaderSelector();
              this.renderCityDropdown(); // S'assure que la ville est bien sélectionnée dans le select
              if (typeof callback === 'function') callback();
            },
            (err) => {
              console.warn("GPS non disponible ou refusé:", err);
              this.currentCountry = 'CM';
              this.currentCity = 'Yaoundé';
              this.currentDistrict = ''; 
              this.currentLocation = this.countryData['CM'].cities['Yaoundé'];
              this.syncHeaderSelector();
              this.renderCityDropdown();
              if (typeof callback === 'function') callback();
            },
            { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 } // maximumAge: 0 force l'ignorance du cache GPS du navigateur
          );
        } else {
          this.syncHeaderSelector();
          this.renderCityDropdown();
          if (typeof callback === 'function') callback();
        }
      }

      syncHeaderSelector() {
        const countrySelect = document.getElementById('country-selector');
        if (countrySelect && this.currentCountry) {
          countrySelect.value = this.currentCountry;
        }
      }

      changeCountry(code) {
        this.currentCountry = code;
        const countryInfo = this.countryData[code];
        if (countryInfo) {
          const firstCity = Object.keys(countryInfo.cities)[0];
          this.currentCity = firstCity;
          this.currentLocation = countryInfo.cities[firstCity];
          
          this.currentDistrict = '';
          const districtInput = document.getElementById('district-input');
          if (districtInput) districtInput.value = '';

          this.renderCityDropdown();
          this.initMap();
          this.realPharmacies = [];
          this.updateMapAndCards();
          this.fetchRealPharmaciesOSM(5000, true);
        }
      }

      changeCity(cityName) {
        if (!this.currentCountry) return;
        this.currentCity = cityName;
        const cityCoords = this.countryData[this.currentCountry]?.cities[cityName];
        if (cityCoords) {
          this.currentLocation = cityCoords;
          
          this.currentDistrict = '';
          const districtInput = document.getElementById('district-input');
          if (districtInput) districtInput.value = '';

          const badgeCityHeader = document.getElementById('header-city-badge');
          if (badgeCityHeader) badgeCityHeader.textContent = this.currentCity;

          this.initMap();
          this.realPharmacies = [];
          this.updateMapAndCards();
          this.fetchRealPharmaciesOSM(5000, true);
        }
      }

      renderCityDropdown() {
        const citySelect = document.getElementById('active-city-select');
        if (!citySelect) return;

        if (!this.currentCountry || !this.countryData[this.currentCountry]) {
          citySelect.disabled = true;
          citySelect.innerHTML = `<option value="">Veuillez choisir un pays</option>`;
        } else {
          citySelect.disabled = false;
          const countryInfo = this.countryData[this.currentCountry];
          const cityOptions = Object.keys(countryInfo.cities).map(city => 
            `<option value="${city}" ${city === this.currentCity ? 'selected' : ''}>${city}</option>`
          ).join('');
          citySelect.innerHTML = cityOptions;
        }
        
        const badgeCityHeader = document.getElementById('header-city-badge');
        if (badgeCityHeader) {
          badgeCityHeader.textContent = this.currentCity;
        }
      }

      navigateTo(view) {
        this.currentView = view;
        document.getElementById('header-title').textContent = `Allo Ramia - ${view.charAt(0).toUpperCase() + view.slice(1)}`;
        
        ['home', 'ordo', 'sos', 'panier', 'conseils', 'compte'].forEach(v => {
          const btn = document.getElementById(`nav-btn-${v}`);
          if (btn) {
            btn.className = v === view 
              ? "flex flex-col items-center py-1 px-3 text-[#6B125C] font-bold transition" 
              : "flex flex-col items-center py-1 px-3 text-slate-400 hover:text-[#6B125C] font-medium transition";
          }
        });

        const container = document.getElementById('view-container');
        
        if (view === 'home') {
          container.innerHTML = this.renderHomeView();
          setTimeout(() => {
            this.syncHeaderSelector();
            this.initMap();
            this.renderCityDropdown();
            const districtInput = document.getElementById('district-input');
            if (districtInput && this.currentDistrict) {
              districtInput.value = this.currentDistrict;
            }
            this.fetchRealPharmaciesOSM(5000);
          }, 100);
        } else if (view === 'ordo') {
          container.innerHTML = this.renderOrdoView();
        } else if (view === 'sos') {
          container.innerHTML = this.renderSosView();
        } else if (view === 'panier') {
          container.innerHTML = this.renderPanierView();
        } else if (view === 'conseils') {
          container.innerHTML = this.renderConseilsView();
        } else if (view === 'compte') {
          container.innerHTML = this.renderCompteView();
        }
      }

      renderHomeView() {

                <span id="header-city-badge" class="text-xs font-mono bg-pink-900/50 px-2 py-0.5 rounded text-pink-200">${this.currentCity}</span>
              </div>

              <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight">Trouvez vos médicaments à proximité.</h2>
              <p class="text-xs text-pink-100">Pharmacies identifiées autour du point de livraison et classées par distance.</p>
              
              <div class="bg-white/10 p-3.5 rounded-xl backdrop-blur-md space-y-3">
                <div class="flex flex-col sm:flex-row gap-2">
                  <input type="text" id="search-input" value="${this.searchedMedicine}" placeholder="Saisir le nom du médicament (ex: Paracétamol, Amoxicilline)..." class="flex-1 px-3.5 py-2.5 text-xs text-slate-800 bg-white rounded-xl focus:outline-none shadow-inner">
                  
                  <div class="flex gap-2">
                    <button id="search-btn" onclick="window.app.performSearch()" class="flex-1 sm:flex-none bg-white text-[#6B125C] px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-pink-50 transition shadow flex items-center justify-center space-x-2">
                      <i class="fa-solid fa-magnifying-glass"></i>
                      <span>Rechercher</span>
                    </button>

                    <button id="stop-btn" onclick="window.app.cancelSearch()" class="hidden bg-red-500 hover:bg-red-600 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition shadow flex items-center justify-center space-x-1" title="Annuler">
                      <i class="fa-solid fa-xmark text-sm"></i>
                      <span>Stop</span>
                    </button>
                  </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 text-xs">
                  <div class="flex items-center space-x-2">
                    <span class="text-pink-100 font-semibold shrink-0">Ville :</span>
                    <select id="active-city-select" onchange="window.app.changeCity(this.value)" class="bg-white text-[#6B125C] font-bold text-xs px-3 py-1.5 rounded-lg focus:outline-none cursor-pointer flex-1">
                    </select>
                  </div>
                  <div class="flex items-center space-x-2">
                    <span class="text-pink-100 font-semibold shrink-0">Quartier / Secteur :</span>
                    <input type="text" id="district-input" value="${this.currentDistrict}" onchange="window.app.currentDistrict = this.value" placeholder="ex: Bastos, Akwa, Kotto (optionnel)..." class="flex-1 px-3 py-1.5 text-xs text-slate-800 bg-white rounded-lg focus:outline-none">
                  </div>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-brand-border p-4 shadow-sm">
              <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2">
                  <i class="fa-solid fa-map-location-dot text-[#6B125C]"></i>
                  <h3 class="font-bold text-slate-800 text-sm">Carte des Officines Autour de Votre Point de Livraison</h3>
                </div>
                <button onclick="window.app.getCurrentGPSLocation()" class="text-xs bg-pink-50 text-[#6B125C] hover:bg-pink-100 px-3 py-1.5 rounded-lg font-bold transition flex items-center space-x-1 border border-pink-200">
                  <i class="fa-solid fa-crosshairs text-pink-700"></i>
                  <span>Réactualiser Position GPS</span>
                </button>
              </div>
              
              <div id="osm-map" class="w-full h-80 sm:h-96 rounded-xl border border-slate-200 z-10 shadow-inner"></div>
            </div>

            <div class="bg-white rounded-2xl border border-brand-border p-4 sm:p-5 shadow-sm mb-6">
              <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 mb-4 pb-3 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-sm sm:text-base">Pharmacies trouvées (par proximité)</h3>
                <div class="flex items-center space-x-2">
                  <span id="pharmacy-count-badge" class="px-3 py-1 bg-emerald-50 text-emerald-700 font-bold text-xs rounded-full border border-emerald-200">0 pharmacie</span>
                  <span id="radius-badge" class="px-3 py-1 bg-pink-50 text-[#6B125C] font-bold text-xs rounded-full border border-pink-200">Rayon : 5 km</span>
                </div>
              </div>
              <div id="pharmacies-grid" class="space-y-3">
              </div>
              <!-- ESPACEUR TAMPON DE SÉCURITÉ EN BAS DE LA LISTE -->
              <div class="h-16"></div>
            </div>
          </div>
        `;
      }

      initMap() {
        const container = document.getElementById('osm-map');
        if (!container || !this.currentLocation) return;
        if (this.map) this.map.remove();
        
        this.map = L.map('osm-map', { zoomControl: true }).setView([this.currentLocation.lat, this.currentLocation.lng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(this.map);
      }

      getCurrentGPSLocation() {
        if (this.activeSearchController) {
          this.activeSearchController.abort();
          this.activeSearchController = null;
        }
        this.isLoadingPharmacies = false;
        this.autoDetectUserLocation(() => {
          this.renderCityDropdown();
          const districtInput = document.getElementById('district-input');
          if (districtInput) districtInput.value = this.currentDistrict;
          this.fetchRealPharmaciesOSM(5000, true);
        });
      }

      async performSearch() {
        const input = document.getElementById('search-input');
        const districtInput = document.getElementById('district-input');

        if (input) this.searchedMedicine = input.value.trim();
        if (districtInput) this.currentDistrict = districtInput.value.trim();

        if (this.currentDistrict !== "") {
          const countryName = this.countryData[this.currentCountry]?.name || "Cameroun";
          const searchAddress = `${this.currentDistrict}, ${this.currentCity}, ${countryName}`;
          try {
            const controllerGeo = new AbortController();
            const timeoutGeo = setTimeout(() => controllerGeo.abort(), 2500);
            const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchAddress)}`, { signal: controllerGeo.signal });
            clearTimeout(timeoutGeo);
            const geoData = await geoRes.json();
            if (geoData && geoData.length > 0) {
              this.currentLocation = { lat: parseFloat(geoData[0].lat), lng: parseFloat(geoData[0].lon) };
            }
          } catch(e) {}
        }

        await this.fetchRealPharmaciesOSM(5000, true);
      }

      cancelSearch() {
        if (this.activeSearchController) {
          this.activeSearchController.abort();
          this.activeSearchController = null;
        }
        this.isLoadingPharmacies = false;
        this.resetSearchButtons();

        const gridHome = document.getElementById('pharmacies-grid');
        if (gridHome) {
          gridHome.innerHTML = `
            <div class="p-4 text-center space-y-2 bg-amber-50 rounded-xl border border-amber-200">
              <i class="fa-solid fa-circle-exclamation text-xl text-amber-600"></i>
              <p class="text-xs font-bold text-amber-800">Recherche interrompue.</p>
              <p class="text-[11px] text-amber-700">Vous pouvez relancer ou affiner votre recherche.</p>
            </div>
          `;
        }
      }

      setSearchStateLoading() {
        const searchBtn = document.getElementById('search-btn');
        const stopBtn = document.getElementById('stop-btn');

        if (searchBtn) {
          searchBtn.disabled = true;
          searchBtn.className = "flex-1 sm:flex-none bg-[#4A0C40] text-pink-200 px-5 py-2.5 rounded-xl text-xs font-bold shadow-inner flex items-center justify-center space-x-2 cursor-wait opacity-90";
          searchBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-sm"></i><span>Recherche...</span>`;
        }
        if (stopBtn) stopBtn.classList.remove('hidden');
      }

      resetSearchButtons() {
        const searchBtn = document.getElementById('search-btn');
        const stopBtn = document.getElementById('stop-btn');

        if (searchBtn) {
          searchBtn.disabled = false;
          searchBtn.className = "flex-1 sm:flex-none bg-white text-[#6B125C] px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-pink-50 transition shadow flex items-center justify-center space-x-2";
          searchBtn.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i><span>Rechercher</span>`;
        }
        if (stopBtn) stopBtn.classList.add('hidden');
      }

      async fetchRealPharmaciesOSM(radius = 5000, forceRefresh = false) {
        if (!this.currentLocation) return;
        
        const lat = this.currentLocation.lat;
        const lng = this.currentLocation.lng;

        const cacheKey = `ramia_cache_${lat.toFixed(2)}_${lng.toFixed(2)}_${radius}`;
        const cacheTimeKey = `${cacheKey}_time`;
        const cachedData = localStorage.getItem(cacheKey);
        const cachedTime = localStorage.getItem(cacheTimeKey);
        const CACHE_TTL = 30 * 60 * 1000;

        if (!forceRefresh && cachedData && cachedTime && (Date.now() - parseInt(cachedTime, 10) < CACHE_TTL)) {
          this.realPharmacies = JSON.parse(cachedData);
          this.isLoadingPharmacies = false;
          this.initMap();
          this.updateMapAndCards();
          return;
        }

        if (this.activeSearchController) {
          this.activeSearchController.abort();
        }
        this.activeSearchController = new AbortController();

        this.searchRadius = radius;
        this.isLoadingPharmacies = true;
        this.setSearchStateLoading();
        this.updateMapAndCards();

        const apiKey = "6faa54ea808d43b7a3c26e7f3fce4da2";
        const url = `https://api.geoapify.com/v2/places?categories=healthcare.pharmacy&filter=circle:${lng},${lat},${radius}&bias=proximity:${lng},${lat}&limit=30&apiKey=${apiKey}`;

        let pharmaciesList = [];

        try {
          const response = await fetch(url, { signal: this.activeSearchController.signal });
          const data = await response.json();

          if (data && data.features) {
            pharmaciesList = data.features.map(f => {
              const props = f.properties;
              const elLat = props.lat;
              const elLon = props.lon;

              const R = 6371;
              const dLat = (elLat - lat) * Math.PI / 180;
              const dLon = (elLon - lng) * Math.PI / 180;
              const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                        Math.cos(lat * Math.PI / 180) * Math.cos(elLat * Math.PI / 180) * 
                        Math.sin(dLon/2) * Math.sin(dLon/2);
              const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
              const distance = R * c;

              return {
                id: props.place_id || Math.random(),
                name: props.name || "Pharmacie de Garde",
                phone: props.contact?.phone || props.datasource?.raw?.phone || null,
                email: props.contact?.email || null,
                website: props.website || null,
                openingHours: props.opening_hours || null,
                brand: props.brand || null,
                address: props.formatted || props.address_line2 || "Adresse non renseignée",
                lat: elLat,
                lng: elLon,
                distance: distance
              };
            });
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.warn("Erreur lors de la récupération Geoapify", err);
          }
        }

        this.realPharmacies = pharmaciesList.sort((a, b) => a.distance - b.distance);

        try {
          localStorage.setItem(cacheKey, JSON.stringify(this.realPharmacies));
          localStorage.setItem(cacheTimeKey, Date.now().toString());
        } catch (e) {}

        this.isLoadingPharmacies = false;
        this.resetSearchButtons();
        this.initMap();
        this.updateMapAndCards();
      }

      updateMapAndCards() {
        if (this.currentView === 'home' && this.map && this.currentLocation) {
          this.map.setView([this.currentLocation.lat, this.currentLocation.lng], 14);
          if (this.userMarker) this.map.removeLayer(this.userMarker);
          
          this.userMarker = L.circleMarker([this.currentLocation.lat, this.currentLocation.lng], {
            radius: 8, fillColor: "#A1197A", color: "#FFFFFF", weight: 2.5, fillOpacity: 0.95
          }).addTo(this.map);

          this.mapMarkers.forEach(m => this.map.removeLayer(m));
          this.mapMarkers = [];

          this.realPharmacies.forEach(p => {
            const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${this.currentLocation.lat},${this.currentLocation.lng}&destination=${p.lat},${p.lng}&travelmode=driving`;
            const marker = L.marker([p.lat, p.lng]).addTo(this.map);
            
            marker.bindPopup(`
              <div class="space-y-1">
                <strong class="text-xs text-[#6B125C] font-bold block">${p.name}</strong>
                <p class="text-[10px] text-slate-600 truncate">${p.address}</p>
                <div class="flex items-center justify-between pt-1">
                  <span class="text-[10px] text-emerald-600 font-bold">À ${p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km'}</span>
                  <a href="${mapsUrl}" target="_blank" class="text-[9px] bg-[#6B125C] text-white px-2 py-0.5 rounded font-bold hover:bg-pink-700">GPS</a>
                </div>
              </div>
            `);
            this.mapMarkers.push(marker);
          });
        }

        const gridHome = document.getElementById('pharmacies-grid');
        const radiusBadge = document.getElementById('radius-badge');
        const countBadge = document.getElementById('pharmacy-count-badge');

        if (radiusBadge) radiusBadge.textContent = `Rayon : ${(this.searchRadius/1000).toFixed(0)} km`;
        
        if (countBadge) {
          const totalFound = this.realPharmacies.length;
          countBadge.textContent = `${totalFound} pharmacie${totalFound > 1 ? 's' : ''}`;
        }

        let htmlCards = "";
        if (this.isLoadingPharmacies) {
          const locText = this.currentDistrict ? `${this.currentDistrict} (${this.currentCity})` : `${this.currentCity}`;
          htmlCards = `
            <div class="p-5 text-center space-y-2 bg-pink-50/50 rounded-2xl border border-pink-100">
              <i class="fa-solid fa-circle-notch fa-spin text-2xl text-[#6B125C]"></i>
              <p class="text-xs font-bold text-slate-800">Recherche rapide autour de ${locText}...</p>
            </div>
          `;
        } else if (this.realPharmacies.length === 0) {
          htmlCards = `
            <div class="p-5 text-center space-y-3 bg-amber-50 rounded-2xl border border-amber-200">
              <i class="fa-solid fa-triangle-exclamation text-2xl text-amber-600"></i>
              <p class="text-xs font-bold text-amber-900">Aucune pharmacie n'a été trouvée automatiquement dans le rayon de 5 km.</p>
              <p class="text-[11px] text-amber-700">Sélectionnez votre ville ou saisissez votre quartier ci-dessus pour relancer la recherche.</p>
              <button onclick="window.app.getCurrentGPSLocation()" class="mt-2 bg-[#6B125C] text-white text-xs font-bold px-4 py-2 rounded-xl shadow hover:bg-pink-800 transition">
                Réactualiser la position GPS
              </button>
            </div>
          `;
        } else {
          htmlCards = this.realPharmacies.map(p => {
            const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${this.currentLocation.lat},${this.currentLocation.lng}&destination=${p.lat},${p.lng}&travelmode=driving`;
            const distLabel = p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km';
            const medNameToOrder = this.searchedMedicine ? this.searchedMedicine : "Médicament demandé";

            return `
              <div class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-sm hover:border-[#6B125C] transition space-y-2.5">
                <div class="flex items-start justify-between">
                  <div class="space-y-0.5">
                    <div class="flex items-center space-x-1.5">
                      <span class="text-sm">💊</span>
                      <h4 class="font-bold text-[#6B125C] text-xs sm:text-sm">${p.name}</h4>
                    </div>
                    
                    <p class="text-[11px] text-slate-600 leading-tight">
                      <strong class="text-slate-700"><i class="fa-solid fa-location-dot text-pink-700 mr-1"></i>Adresse :</strong> ${p.address}
                    </p>

                    <div class="flex flex-wrap gap-x-3 gap-y-0.5 text-[11px] text-slate-500 pt-0.5">
                      <span><strong class="text-slate-700"><i class="fa-solid fa-phone text-[10px] mr-1"></i>Tél :</strong> ${p.phone ? `<a href="tel:${p.phone}" class="text-emerald-700 font-bold hover:underline">${p.phone}</a>` : '<span class="italic text-slate-400">Non renseigné</span>'}</span>
                      ${p.openingHours ? `<span><strong class="text-slate-700"><i class="fa-solid fa-clock text-[10px] mr-1"></i>Horaires :</strong> <span class="text-amber-700 font-medium">${p.openingHours}</span></span>` : ''}
                    </div>
                  </div>

                  <span class="px-2.5 py-0.5 bg-emerald-50 text-emerald-700 font-bold text-[11px] rounded-full border border-emerald-200 shrink-0">
                    À ${distLabel}
                  </span>
                </div>

                <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100">
                  <a href="tel:${p.phone || '#'}" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-1.5 rounded-lg text-[11px] transition text-center flex items-center justify-center space-x-1 ${!p.phone ? 'opacity-50 pointer-events-none' : ''}">
                    <i class="fa-solid fa-phone text-emerald-600 text-[10px]"></i>
                    <span>Appeler</span>
                  </a>

                  <a href="${mapsUrl}" target="_blank" class="w-full bg-pink-50 hover:bg-pink-100 border border-pink-200 text-[#6B125C] font-bold py-1.5 rounded-lg text-[11px] transition text-center flex items-center justify-center space-x-1 shadow-sm">
                    <i class="fa-solid fa-diamond-turn-right text-pink-700 text-xs"></i>
                    <span>Itinéraire</span>
                  </a>

                  <button onclick="window.app.addToCart('${medNameToOrder.replace(/'/g, "\\'")}', 3500, '${p.name.replace(/'/g, "\\'")}')" class="w-full bg-[#6B125C] hover:bg-[#851264] text-white font-bold py-1.5 rounded-lg text-[11px] shadow transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-cart-plus text-[10px]"></i>
                    <span>Commander</span>
                  </button>
                </div>
              </div>
            `;
          }).join('');
        }

        if (gridHome) gridHome.innerHTML = htmlCards;
      }

      addToCart(name, price, pharmacyName) {
        this.cart.push({ id: Date.now(), name: `${name} (${pharmacyName})`, price: price, qty: 1 });
        this.updateCartBadge();
        this.navigateTo('panier');
      }

      renderPanierView() {
        return `<div class="bg-white rounded-2xl p-6 shadow-sm border border-brand-border space-y-4"><h2 class="text-lg font-bold text-[#6B125C]">Panier (${this.cart.length})</h2>${this.cart.length === 0 ? '<p class="text-xs text-slate-400">Votre panier est vide.</p>' : ''}</div>`;
      }
      renderOrdoView() { return `<div class="bg-white rounded-2xl p-6 text-center"><h2 class="text-lg font-bold text-[#6B125C]">Importer une Ordonnance</h2></div>`; }
      renderSosView() { return `<div class="bg-white rounded-2xl p-6 text-center"><h2 class="text-lg font-bold text-red-600">Urgence SOS (+237 677 550 909)</h2></div>`; }
      renderConseilsView() { return `<div class="bg-white rounded-2xl p-6"><h2 class="text-lg font-bold text-[#6B125C]">Conseils Médicaux</h2></div>`; }
      renderCompteView() { return `<div class="bg-white rounded-2xl p-6"><h2 class="text-lg font-bold text-[#6B125C]">Mon Profil</h2></div>`; }

      updateCartBadge() {
        const badge = document.getElementById('cart-badge-count');
        if (badge) {
          badge.textContent = this.cart.length;
          if (this.cart.length > 0) badge.classList.remove('hidden');
          else badge.classList.add('hidden');
        }
      }
    }

    window.app = new AlloRamiaApp();
    window.onload = () => { window.app.init(); };
  </script>
</body>
</html>
