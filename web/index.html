<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#F8F3F7]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allo Ramia | Plateforme Médicale & Pharmacies de Garde Internationale</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { main: '#6B125C', accent: '#A1197A', light: '#F8F3F7', card: '#FFFFFF', border: '#EFE3ED' }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Leaflet CSS for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #F8F3F7; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #A1197A; border-radius: 3px; }
  </style>
</head>
<body class="h-full text-slate-800 flex flex-col antialiased selection:bg-[#A1197A] selection:text-white pb-36">

  <!-- HEADER -->
  <header class="bg-[#6B125C] text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="window.app.navigateTo('home')">
        <div class="w-10 h-10 rounded-xl bg-white text-[#6B125C] flex items-center justify-center font-black text-xl shadow">💊</div>
        <div>
          <h1 id="header-title" class="text-xl font-bold tracking-tight">Allo Ramia - Accueil</h1>
          <p class="text-[10px] text-pink-200 uppercase tracking-widest font-medium">Santé & Garde Internationale</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <select id="country-selector" onchange="window.app.changeCountry(this.value)" class="bg-[#851264] text-white text-xs font-semibold px-2.5 py-1.5 rounded-xl border border-pink-400/30 focus:outline-none cursor-pointer">
          <option value="CM" selected>🇨🇲 Cameroun</option>
          <option value="CI">🇨🇮 Côte d'Ivoire</option>
          <option value="GH">🇬🇭 Ghana</option>
          <option value="GQ">🇬🇶 Guinée Équatoriale</option>
          <option value="NG">🇳🇬 Nigeria</option>
          <option value="BJ">🇧🇯 Bénin</option>
          <option value="CG">🇨🇬 Congo (Brazzaville)</option>
          <option value="CD">🇨🇩 RDC (Kinshasa)</option>
          <option value="GA">🇬🇦 Gabon</option>
          <option value="CF">🇨🇫 Centrafrique (RCA)</option>
          <option value="TD">🇹🇩 Tchad</option>
          <option value="SN">🇸🇳 Sénégal</option>
        </select>
        
        <div class="hidden sm:flex items-center px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-200 border border-emerald-400/30">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse mr-2"></span>
          Accès Libre
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col space-y-8">
    <div id="view-container" class="flex-1 space-y-8"></div>
  </main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-brand-border shadow-2xl z-50 py-2 px-2">
    <div class="max-w-xl mx-auto flex items-center justify-around text-center">
      <button onclick="window.app.navigateTo('home')" id="nav-btn-home" class="flex flex-col items-center py-1 px-3 text-[#6B125C] transition">
        <i class="fa-solid fa-house text-lg mb-1"></i>
        <span class="text-[10px] font-bold">Accueil</span>
      </button>
      <button onclick="window.app.navigateTo('ordo')" id="nav-btn-ordo" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-[#6B125C] transition">
        <i class="fa-solid fa-file-medical text-lg mb-1"></i>
        <span class="text-[10px] font-medium">Ordo.</span>
      </button>
      <button onclick="window.app.navigateTo('sos')" id="nav-btn-sos" class="flex flex-col items-center py-1 px-3 text-red-600 transition">
        <i class="fa-solid fa-triangle-exclamation text-lg mb-1"></i>
        <span class="text-[10px] font-bold">SOS</span>
      </button>
      <button onclick="window.app.navigateTo('panier')" id="nav-btn-panier" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-[#6B125C] transition relative">
        <i class="fa-solid fa-cart-shopping text-lg mb-1"></i>
        <span class="text-[10px] font-medium">Panier</span>
        <span id="cart-badge-count" class="hidden absolute -top-1 right-2 bg-pink-600 text-white text-[9px] font-bold px-1.5 py-0.2 rounded-full">0</span>
      </button>
      <button onclick="window.app.navigateTo('conseils')" id="nav-btn-conseils" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-[#6B125C] transition">
        <i class="fa-solid fa-book-medical text-lg mb-1"></i>
        <span class="text-[10px] font-medium">Conseils</span>
      </button>
      <button onclick="window.app.navigateTo('compte')" id="nav-btn-compte" class="flex flex-col items-center py-1 px-3 text-slate-400 hover:text-[#6B125C] transition">
        <i class="fa-solid fa-user text-lg mb-1"></i>
        <span class="text-[10px] font-medium">Compte</span>
      </button>
    </div>
  </nav>

  <!-- SCRIPT ENGINE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAkJB6hhLiF-2K_BfzjayR1Ll6WOJMm3wM",
      authDomain: "allo-ramia.firebaseapp.com",
      projectId: "allo-ramia",
      storageBucket: "allo-ramia.firebasestorage.app",
      messagingSenderId: "203296803502",
      appId: "1:203296803502:web:2080779ac6306918d8fb3f"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const firebaseDb = getFirestore(firebaseApp);

    class AlloRamiaApp {
      constructor() {
        this.currentView = 'home';
        this.currentCountry = 'CM';
        this.currentCity = 'Yaoundé';
        this.currentDistrict = '';
        this.map = null;
        this.mapMarkers = [];
        this.userMarker = null;
        this.currentLocation = { lat: 3.8480, lng: 11.5021 };
        this.realPharmacies = [];
        this.searchRadius = 5000; // Rayon initial de 5 km
        this.searchedMedicine = "";
        this.isLoadingPharmacies = false;
        this.activeSearchController = null; // Contrôleur pour stopper la recherche

        this.countryData = {
          'CM': { 
            name: 'Cameroun', currency: 'XAF', phonePrefix: '+237',
            cities: { 
              'Yaoundé': { lat: 3.8480, lng: 11.5021 }, 'Douala': { lat: 4.0511, lng: 9.7679 }, 
              'Bafoussam': { lat: 5.4778, lng: 10.4176 }, 'Garoua': { lat: 9.3011, lng: 13.3977 },
              'Maroua': { lat: 10.5910, lng: 14.3159 }, 'Bamenda': { lat: 5.9631, lng: 10.1591 },
              'Buea': { lat: 4.1550, lng: 9.2435 }, 'Limbe': { lat: 4.0244, lng: 9.2149 },
              'Kribi': { lat: 2.9388, lng: 9.9077 }, 'Ebolowa': { lat: 2.9167, lng: 11.1500 },
              'Bertoua': { lat: 4.5773, lng: 13.6846 }, 'Ngaoundéré': { lat: 7.3195, lng: 13.5841 }
            }
          },
          'CI': { 
            name: 'Côte d\'Ivoire', currency: 'FCFA', phonePrefix: '+225',
            cities: { 
              'Abidjan': { lat: 5.3600, lng: -4.0083 }, 'Bouaké': { lat: 7.6938, lng: -5.0303 },
              'Yamoussoukro': { lat: 6.8276, lng: -5.2893 }, 'San-Pédro': { lat: 4.7485, lng: -6.6363 }
            }
          },
          'GH': {
            name: 'Ghana', currency: 'GHS', phonePrefix: '+233',
            cities: { 'Accra': { lat: 5.6037, lng: -0.1870 }, 'Kumasi': { lat: 6.6885, lng: -1.6244 } }
          },
          'GQ': {
            name: 'Guinée Équatoriale', currency: 'XAF', phonePrefix: '+240',
            cities: { 'Malabo': { lat: 3.7504, lng: 8.7371 }, 'Bata': { lat: 1.8639, lng: 9.7658 } }
          },
          'NG': {
            name: 'Nigeria', currency: 'NGN', phonePrefix: '+234',
            cities: { 'Lagos': { lat: 6.5244, lng: 3.3792 }, 'Abuja': { lat: 9.0765, lng: 7.3986 } }
          },
          'BJ': { 
            name: 'Bénin', currency: 'FCFA', phonePrefix: '+229',
            cities: { 'Cotonou': { lat: 6.3654, lng: 2.4183 }, 'Porto-Novo': { lat: 6.4969, lng: 2.6288 } }
          },
          'CG': { 
            name: 'Congo (Brazzaville)', currency: 'XAF', phonePrefix: '+242',
            cities: { 'Brazzaville': { lat: -4.2634, lng: 15.2429 }, 'Pointe-Noire': { lat: -4.7692, lng: 11.8664 } }
          },
          'CD': {
            name: 'RDC (Kinshasa)', currency: 'CDF', phonePrefix: '+243',
            cities: { 'Kinshasa': { lat: -4.4419, lng: 15.2663 }, 'Lubumbashi': { lat: -11.6874, lng: 27.4847 } }
          },
          'GA': { 
            name: 'Gabon', currency: 'XAF', phonePrefix: '+241',
            cities: { 'Libreville': { lat: 0.3901, lng: 9.4544 }, 'Port-Gentil': { lat: -0.7193, lng: 8.7815 } }
          },
          'CF': {
            name: 'Centrafrique (RCA)', currency: 'XAF', phonePrefix: '+236',
            cities: { 'Bangui': { lat: 4.3947, lng: 18.5582 } }
          },
          'TD': { 
            name: 'Tchad', currency: 'XAF', phonePrefix: '+235',
            cities: { 'N\'Djamena': { lat: 12.1348, lng: 15.0557 } }
          },
          'SN': {
            name: 'Sénégal', currency: 'FCFA', phonePrefix: '+221',
            cities: { 'Dakar': { lat: 14.7167, lng: -17.4677 } }
          }
        };

        this.cart = [];

        this.recipientInfo = {
          isForSelf: false,
          recipientName: "",
          phonePrefix: "+237",
          recipientPhone: "",
          deliveryAddress: "Livraison locale",
          deliveryMode: "DELIVERY",
          generatedPin: null
        };
      }

      init() {
        this.navigateTo('home');
        this.updateCartBadge();
        this.autoDetectUserLocation();
      }

      autoDetectUserLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              this.currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
              try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
                const data = await res.json();
                if (data && data.address) {
                  const countryCode = (data.address.country_code || '').toUpperCase();
                  const detectedCity = data.address.city || data.address.town || data.address.village || data.address.county || '';

                  if (this.countryData[countryCode]) {
                    this.currentCountry = countryCode;
                    const countrySelect = document.getElementById('country-selector');
                    if (countrySelect) countrySelect.value = countryCode;
                  }

                  if (detectedCity) {
                    this.currentCity = detectedCity;
                    if (!this.countryData[this.currentCountry].cities[detectedCity]) {
                      this.countryData[this.currentCountry].cities[detectedCity] = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                    }
                  }
                }
              } catch (e) {
                console.log("Géocodage inverse indisponible, utilisation des coordonnées GPS pures.");
              }

              this.renderCityDropdown();
              this.fetchRealPharmaciesOSM(5000);
            },
            () => {
              this.fetchRealPharmaciesOSM(5000);
            },
            { enableHighAccuracy: true, timeout: 8000 }
          );
        } else {
          this.fetchRealPharmaciesOSM(5000);
        }
      }

      changeCountry(code) {
        this.currentCountry = code;
        const countryInfo = this.countryData[code];
        if (countryInfo) {
          this.recipientInfo.phonePrefix = countryInfo.phonePrefix;
          const firstCity = Object.keys(countryInfo.cities)[0];
          this.currentCity = firstCity;
          this.currentLocation = countryInfo.cities[firstCity];

          this.renderCityDropdown();
          this.fetchRealPharmaciesOSM(5000);
        }
      }

      changeCity(cityName) {
        if (!this.currentCountry) return;
        this.currentCity = cityName;
        const cityCoords = this.countryData[this.currentCountry].cities[cityName];
        if (cityCoords) {
          this.currentLocation = cityCoords;
          this.fetchRealPharmaciesOSM(5000);
        }
      }

      renderCityDropdown() {
        const citySelect = document.getElementById('active-city-select');
        if (!citySelect) return;

        if (!this.currentCountry) {
          citySelect.disabled = true;
          citySelect.innerHTML = `<option value="">Veuillez d'abord choisir un pays</option>`;
          citySelect.className = "bg-slate-200 text-slate-400 font-bold text-xs px-3 py-1.5 rounded-lg focus:outline-none cursor-not-allowed";
        } else {
          citySelect.disabled = false;
          const countryInfo = this.countryData[this.currentCountry];
          const cityOptions = Object.keys(countryInfo.cities).map(city => 
            `<option value="${city}" ${city === this.currentCity ? 'selected' : ''}>${city}</option>`
          ).join('');

          citySelect.innerHTML = cityOptions;
          citySelect.className = "bg-white text-[#6B125C] font-bold text-xs px-3 py-1.5 rounded-lg focus:outline-none cursor-pointer";
        }
      }

      navigateTo(view) {
        this.currentView = view;
        document.getElementById('header-title').textContent = `Allo Ramia - ${view.charAt(0).toUpperCase() + view.slice(1)}`;
        
        ['home', 'ordo', 'sos', 'panier', 'conseils', 'compte'].forEach(v => {
          const btn = document.getElementById(`nav-btn-${v}`);
          if (btn) {
            btn.className = v === view 
              ? "flex flex-col items-center py-1 px-3 text-[#6B125C] font-bold transition" 
              : "flex flex-col items-center py-1 px-3 text-slate-400 hover:text-[#6B125C] font-medium transition";
          }
        });

        const container = document.getElementById('view-container');
        
        if (view === 'home') {
          container.innerHTML = this.renderHomeView();
          setTimeout(() => {
            const countrySelect = document.getElementById('country-selector');
            if (countrySelect && this.currentCountry) {
              countrySelect.value = this.currentCountry;
            }
            this.initMap();
            this.renderCityDropdown();
            this.fetchRealPharmaciesOSM(5000);
          }, 100);
        } else if (view === 'ordo') {
          container.innerHTML = this.renderOrdoView();
        } else if (view === 'sos') {
          container.innerHTML = this.renderSosView();
        } else if (view === 'panier') {
          container.innerHTML = this.renderPanierView();
        } else if (view === 'conseils') {
          container.innerHTML = this.renderConseilsView();
        } else if (view === 'compte') {
          container.innerHTML = this.renderCompteView();
        }
      }

      renderHomeView() {
        return `
          <div class="space-y-8">
            <div class="bg-gradient-to-r from-[#6B125C] to-[#A1197A] rounded-2xl p-6 sm:p-8 text-white shadow-xl space-y-4">
              <span class="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-semibold">📍 Géolocalisation Réelle GPS (Rayon adaptatif : 5 km à 10 km)</span>
              <h2 class="text-2xl sm:text-3xl font-extrabold mb-1">Trouvez vos médicaments à proximité.</h2>
              <p class="text-sm text-pink-100 mb-4">Pharmacies identifiées depuis le point de livraison et classées par proximité.</p>
              
              <div class="bg-white/10 p-4 rounded-2xl backdrop-blur-md space-y-3">
                <div class="flex flex-col sm:flex-row gap-2">
                  <input type="text" id="search-input" value="${this.searchedMedicine}" placeholder="Saisir le nom du médicament (optionnel)..." class="flex-1 px-4 py-2.5 text-xs text-slate-800 bg-white rounded-xl focus:outline-none">
                  
                  <div class="flex gap-2">
                    <button id="search-btn" onclick="window.app.performSearch()" class="flex-1 sm:flex-none bg-white text-[#6B125C] px-6 py-2.5 rounded-xl text-xs font-bold hover:bg-pink-50 transition shadow flex items-center justify-center space-x-2">
                      <i class="fa-solid fa-magnifying-glass"></i>
                      <span>Rechercher</span>
                    </button>

                    <!-- BOUTON STOP / ANNULER DE SECOURS -->
                  <button id="stop-btn" onclick="window.app.cancelSearch()" class="bg-[#6B125C] hover:bg-[#851264] text-white px-4 py-2.5 rounded-xl text-xs font-bold transition shadow flex items-center justify-center space-x-1" title="Annuler la recherche en cours">
  <i class="fa-solid fa-xmark text-sm"></i>
  <span>Stop</span>
</button>
                  </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 text-xs">
                  <div class="flex items-center space-x-2">
                    <span class="text-pink-100 font-semibold shrink-0">Ville :</span>
                    <select id="active-city-select" onchange="window.app.changeCity(this.value)" class="bg-white text-[#6B125C] font-bold text-xs px-3 py-1.5 rounded-lg focus:outline-none cursor-pointer flex-1">
                    </select>
                  </div>
                  <div class="flex items-center space-x-2">
                    <span class="text-pink-100 font-semibold shrink-0">Quartier / Secteur :</span>
                    <input type="text" id="district-input" value="${this.currentDistrict}" onchange="window.app.currentDistrict = this.value" placeholder="ex: Kotto, Bastos, Akwa..." class="flex-1 px-3 py-1.5 text-xs text-slate-800 bg-white rounded-lg focus:outline-none">
                  </div>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
              <div class="lg:col-span-2 bg-white rounded-2xl border border-brand-border p-4 shadow-sm">
                <div class="flex items-center justify-between mb-3">
                  <h3 class="font-bold text-slate-800 text-sm">Carte des Officines Autour de Votre Point de Livraison</h3>
                  <button onclick="window.app.getCurrentGPSLocation()" class="text-xs bg-pink-50 text-[#6B125C] hover:bg-pink-100 px-3 py-1.5 rounded-lg font-semibold transition">
                    <i class="fa-solid fa-crosshairs mr-1"></i> Ma Position GPS
                  </button>
                </div>
                <div id="osm-map" class="w-full h-80 rounded-xl border border-slate-200 z-10"></div>
              </div>

              <div class="bg-red-600 text-white rounded-2xl p-6 shadow-md flex flex-col justify-between space-y-6">
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <span class="font-bold text-xs tracking-wider uppercase bg-red-700/60 px-2.5 py-1 rounded-lg">🚨 URGENCE SANTÉ 24H/24</span>
                    <span class="text-[10px] bg-red-800 px-2 py-0.5 rounded-full font-mono">DIRECT</span>
                  </div>
                  <p class="text-xs text-red-100 leading-relaxed">
                    Besoin d'assistance immédiate pour localiser un médicament vital ou une officine de garde ?
                  </p>
                </div>
                <a href="tel:+237677550909" class="w-full bg-white text-red-700 font-bold py-3 rounded-xl text-xs shadow hover:bg-red-50 transition block text-center">
                  <i class="fa-solid fa-phone-volume mr-2"></i> Appeler la Permanence (+237 677 550 909)
                </a>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-brand-border p-6 shadow-sm mt-8">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-slate-800 text-base">Pharmacies détectées (de la plus proche à la plus éloignée)</h3>
                <span id="radius-badge" class="px-3 py-1 bg-pink-50 text-[#6B125C] font-bold text-xs rounded-full border border-pink-200">Rayon : 5 km</span>
              </div>
              <div id="pharmacies-grid" class="space-y-4">
              </div>
            </div>
          </div>
        `;
      }

      initMap() {
        const container = document.getElementById('osm-map');
        if (!container || !this.currentLocation) return;
        if (this.map) {
          this.map.remove();
        }
        this.map = L.map('osm-map').setView([this.currentLocation.lat, this.currentLocation.lng], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(this.map);
      }

      getCurrentGPSLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            this.currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            this.fetchRealPharmaciesOSM(5000);
          }, () => {
            this.fetchRealPharmaciesOSM(5000);
          }, { enableHighAccuracy: true });
        } else {
          this.fetchRealPharmaciesOSM(5000);
        }
      }

      async performSearch() {
        const input = document.getElementById('search-input');
        const districtInput = document.getElementById('district-input');
        const searchBtn = document.getElementById('search-btn');
        const stopBtn = document.getElementById('stop-btn');

        if (searchBtn) {
          searchBtn.disabled = true;
          searchBtn.className = "flex-1 sm:flex-none bg-[#4A0C40] text-pink-200 px-6 py-2.5 rounded-xl text-xs font-bold shadow-inner flex items-center justify-center space-x-2 cursor-wait";
          searchBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-sm"></i><span>Recherche...</span>`;
        }
        if (stopBtn) stopBtn.classList.remove('hidden');

        if (input) this.searchedMedicine = input.value.trim();
        if (districtInput) this.currentDistrict = districtInput.value.trim();

        if (this.currentDistrict !== "") {
          const countryName = this.countryData[this.currentCountry].name;
          const searchAddress = `${this.currentDistrict}, ${this.currentCity}, ${countryName}`;
          try {
            const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchAddress)}`);
            const geoData = await geoRes.json();
            if (geoData && geoData.length > 0) {
              this.currentLocation = { lat: parseFloat(geoData[0].lat), lng: parseFloat(geoData[0].lon) };
            }
          } catch(e) {
            console.log("Géocodage indisponible, utilisation des coordonnées de la ville.");
          }
        }

        await this.fetchRealPharmaciesOSM(5000);

        this.resetSearchButtons();
      }

      cancelSearch() {
        if (this.activeSearchController) {
          this.activeSearchController.abort();
          this.activeSearchController = null;
        }
        this.isLoadingPharmacies = false;
        this.resetSearchButtons();

        const gridHome = document.getElementById('pharmacies-grid');
        if (gridHome) {
          gridHome.innerHTML = `
            <div class="p-6 text-center space-y-2 bg-amber-50 rounded-2xl border border-amber-200">
              <i class="fa-solid fa-circle-exclamation text-2xl text-amber-600"></i>
              <p class="text-xs font-bold text-amber-800">Recherche annulée.</p>
              <p class="text-[11px] text-amber-700">Vous pouvez vérifier vos informations de saisie et relancer la recherche.</p>
            </div>
          `;
        }
      }

      resetSearchButtons() {
        const searchBtn = document.getElementById('search-btn');
        const stopBtn = document.getElementById('stop-btn');

        if (searchBtn) {
          searchBtn.disabled = false;
          searchBtn.className = "flex-1 sm:flex-none bg-white text-[#6B125C] px-6 py-2.5 rounded-xl text-xs font-bold hover:bg-pink-50 transition shadow flex items-center justify-center space-x-2";
          searchBtn.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i><span>Rechercher</span>`;
        }
        if (stopBtn) stopBtn.classList.add('hidden');
      }

      async fetchRealPharmaciesOSM(radius = 5000) {
        if (!this.currentLocation) return;
        
        if (this.activeSearchController) {
          this.activeSearchController.abort();
        }
        this.activeSearchController = new AbortController();

        this.searchRadius = radius;
        this.isLoadingPharmacies = true;
        this.updateMapAndCards();

        const lat = this.currentLocation.lat;
        const lng = this.currentLocation.lng;
        
        const query = `[out:json][timeout:12];(node(around:${radius},${lat},${lng})[amenity=pharmacy];way(around:${radius},${lat},${lng})[amenity=pharmacy];);out center;`;
        
        const mirrors = [
          `https://overpass-api.de/api/interpreter?data=`,
          `https://overpass.kumi.systems/api/interpreter?data=`
        ];

        let data = null;
        for (let mirrorUrl of mirrors) {
          try {
            const response = await fetch(mirrorUrl + encodeURIComponent(query), { signal: this.activeSearchController.signal });

            if (response.ok) {
              data = await response.json();
              break;
            }
          } catch (err) {
            if (err.name === 'AbortError') {
              console.log("Requête annulée par l'utilisateur.");
              return;
            }
            console.warn("Miroir indisponible, tentative sur le suivant...", err);
          }
        }

        this.isLoadingPharmacies = false;

        if (data && data.elements && data.elements.length > 0) {
          this.parsePharmacies(data.elements, lat, lng);
        } else if (radius === 5000) {
          // Si rien n'est trouvé dans les 5 km, élargissement automatique à 10 km
          await this.fetchRealPharmaciesOSM(10000);
        } else {
          this.realPharmacies = [];
          this.updateMapAndCards();
        }
      }

      parsePharmacies(elements, lat, lng) {
        const cityName = this.currentCity || "";
        
        this.realPharmacies = elements.map(el => {
          const tags = el.tags || {};
          const name = tags.name ? tags.name : "Pharmacie (Nom non renseigné)";
          
          // Récupération stricte des vrais numéros, e-mails et sites de la base OpenStreetMap
          const phone = tags.phone || tags['contact:phone'] || tags['phone:mobile'] || tags['contact:mobile'] || null;
          const email = tags.email || tags['contact:email'] || null;
          const website = tags.website || tags['contact:website'] || null;

          const street = tags['addr:street'] || "";
          const housenumber = tags['addr:housenumber'] ? `N° ${tags['addr:housenumber']}` : "";
          const suburb = tags['addr:suburb'] || tags['addr:quarter'] || this.currentDistrict || "";
          const city = tags['addr:city'] || cityName;

          let addressParts = [street, housenumber, suburb, city].filter(Boolean);
          let fullAddress = addressParts.length > 0 ? addressParts.join(", ") : `${cityName}`;

          const elLat = el.lat || (el.center ? el.center.lat : lat);
          const elLon = el.lon || (el.center ? el.center.lon : lng);

          // Calcul de la distance réelle
          const R = 6371;
          const dLat = (elLat - lat) * Math.PI / 180;
          const dLon = (elLon - lng) * Math.PI / 180;
          const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat * Math.PI / 180) * Math.cos(elLat * Math.PI / 180) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
          const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
          const distance = R * c;

          return { id: el.id, name, phone, email, website, address: fullAddress, lat: elLat, lng: elLon, distance };
        }).sort((a, b) => a.distance - b.distance); // Tri par proximité de livraison

        this.initMap();
        this.updateMapAndCards();
      }

      updateMapAndCards() {
        if (this.currentView === 'home' && this.map && this.currentLocation) {
          this.map.setView([this.currentLocation.lat, this.currentLocation.lng], 13);
          if (this.userMarker) this.map.removeLayer(this.userMarker);
          
          const locationTag = this.currentDistrict ? `${this.currentDistrict}, ${this.currentCity}` : this.currentCity;
          this.userMarker = L.circleMarker([this.currentLocation.lat, this.currentLocation.lng], {
            radius: 9, fillColor: "#A1197A", color: "#FFF", weight: 2, fillOpacity: 0.9
          }).addTo(this.map).bindPopup(`📍 Lieu de livraison : ${locationTag}`).openPopup();

          this.mapMarkers.forEach(m => this.map.removeLayer(m));
          this.mapMarkers = [];

          this.realPharmacies.forEach(p => {
            const marker = L.marker([p.lat, p.lng]).addTo(this.map);
            marker.bindPopup(`
              <div class="p-1">
                <strong class="text-xs text-[#6B125C]">${p.name}</strong><br/>
                <span class="text-[10px] text-emerald-600 font-bold">À ${p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km'}</span>
              </div>
            `);
            this.mapMarkers.push(marker);
          });
        }

        const gridHome = document.getElementById('pharmacies-grid');
        const radiusBadge = document.getElementById('radius-badge');
        if (radiusBadge) radiusBadge.textContent = `Rayon : ${(this.searchRadius/1000).toFixed(0)} km`;

        let htmlCards = "";
        if (this.isLoadingPharmacies) {
          const locText = this.currentDistrict ? `${this.currentDistrict} (${this.currentCity})` : `${this.currentCity}`;
          htmlCards = `
            <div class="p-6 text-center space-y-2 bg-pink-50/50 rounded-2xl border border-pink-100">
              <i class="fa-solid fa-circle-notch fa-spin text-2xl text-[#6B125C]"></i>
              <p class="text-xs font-bold text-slate-800">Recherche GPS en cours autour du lieu de livraison à ${locText} (Rayon : ${(this.searchRadius/1000).toFixed(0)} km)...</p>
              <p class="text-[11px] text-slate-500">Extraction des données réelles OpenStreetMap.</p>
            </div>
          `;
        } else if (this.realPharmacies.length === 0) {
          htmlCards = `
            <div class="p-6 text-center space-y-2 bg-slate-50 rounded-2xl border border-slate-200">
              <i class="fa-solid fa-map-location-dot text-2xl text-slate-400"></i>
              <p class="text-xs font-bold text-slate-700">Aucune pharmacie trouvée dans un rayon de ${(this.searchRadius/1000).toFixed(0)} km.</p>
              <p class="text-[11px] text-slate-500">Veuillez vérifier le nom de la ville ou du quartier renseigné.</p>
            </div>
          `;
        } else {
          htmlCards = this.realPharmacies.map(p => {
            const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${this.currentLocation.lat},${this.currentLocation.lng}&destination=${p.lat},${p.lng}&travelmode=driving`;
            const distLabel = p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km';
            const medNameToOrder = this.searchedMedicine ? this.searchedMedicine : "Médicament demandé";

            return `
              <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:border-[#6B125C] transition space-y-4">
                <div class="flex items-start justify-between">
                  <div class="space-y-1">
                    <div class="flex items-center space-x-2">
                      <span class="text-base">💊</span>
                      <h4 class="font-bold text-[#6B125C] text-sm sm:text-base">${p.name}</h4>
                    </div>
                    
                    <p class="text-xs text-slate-600">
                      <strong class="text-slate-700"><i class="fa-solid fa-location-dot text-pink-700 mr-1"></i>Adresse :</strong> ${p.address}
                    </p>

                    <!-- Informations réelles extraites d'OpenStreetMap -->
                    <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500 pt-1">
                      <span><strong class="text-slate-700"><i class="fa-solid fa-phone text-xs mr-1"></i>Tél :</strong> ${p.phone ? `<a href="tel:${p.phone}" class="text-emerald-700 font-bold hover:underline">${p.phone}</a>` : '<span class="italic text-slate-400">Non renseigné</span>'}</span>
                      <span><strong class="text-slate-700"><i class="fa-solid fa-envelope text-xs mr-1"></i>Email :</strong> ${p.email ? `<a href="mailto:${p.email}" class="text-[#6B125C] hover:underline">${p.email}</a>` : '<span class="italic text-slate-400">Non renseigné</span>'}</span>
                      <span><strong class="text-slate-700"><i class="fa-solid fa-globe text-xs mr-1"></i>Site :</strong> ${p.website ? `<a href="${p.website}" target="_blank" class="text-blue-600 hover:underline">Visiter</a>` : '<span class="italic text-slate-400">Non renseigné</span>'}</span>
                    </div>
                  </div>

                  <span class="px-3 py-1 bg-emerald-50 text-emerald-700 font-bold text-xs rounded-full border border-emerald-200 shrink-0">
                    À ${distLabel}
                  </span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-2 border-t border-slate-100">
                  ${p.phone ? `
                    <a href="tel:${p.phone}" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-xs transition text-center flex items-center justify-center space-x-1">
                      <i class="fa-solid fa-phone text-emerald-600 text-xs"></i>
                      <span>Appeler</span>
                    </a>
                  ` : `
                    <button disabled class="w-full bg-slate-100 text-slate-400 font-medium py-2 rounded-xl text-xs text-center flex items-center justify-center space-x-1 cursor-not-allowed opacity-75">
                      <i class="fa-solid fa-phone-slash text-xs"></i>
                      <span>Numéro indisponible</span>
                    </button>
                  `}

                  <a href="${mapsUrl}" target="_blank" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-xl text-xs transition text-center flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-map-location-dot text-[#6B125C] text-xs"></i>
                    <span>Itinéraire</span>
                  </a>

                  <button onclick="window.app.addToCart('${medNameToOrder.replace(/'/g, "\\'")}', 3500, '${p.name.replace(/'/g, "\\'")}')" class="w-full bg-[#6B125C] hover:bg-[#851264] text-white font-bold py-2 rounded-xl text-xs shadow transition flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-cart-plus text-xs"></i>
                    <span>Commander</span>
                  </button>
                </div>
              </div>
            `;
          }).join('');
        }

        if (gridHome) gridHome.innerHTML = htmlCards;
      }

      addToCart(name, price, pharmacyName) {
        this.cart.push({ id: Date.now(), name: `${name} (${pharmacyName})`, price: price, qty: 1 });
        this.updateCartBadge();
        this.navigateTo('panier');
      }

      renderPanierView() {
        return `
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-brand-border space-y-4">
            <h2 class="text-lg font-bold text-[#6B125C]">Panier (${this.cart.length})</h2>
            ${this.cart.length === 0 ? '<p class="text-xs text-slate-400">Votre panier est vide.</p>' : ''}
          </div>
        `;
      }

      renderOrdoView() {
        return `<div class="bg-white rounded-2xl p-6 text-center"><h2 class="text-lg font-bold text-[#6B125C]">Importer une Ordonnance</h2></div>`;
      }

      renderSosView() {
        return `<div class="bg-white rounded-2xl p-6 text-center"><h2 class="text-lg font-bold text-red-600">Urgence SOS (+237 677 550 909)</h2></div>`;
      }

      renderConseilsView() {
        return `<div class="bg-white rounded-2xl p-6"><h2 class="text-lg font-bold text-[#6B125C]">Conseils Médicaux</h2></div>`;
      }

      renderCompteView() {
        return `<div class="bg-white rounded-2xl p-6"><h2 class="text-lg font-bold text-[#6B125C]">Mon Profil</h2></div>`;
      }

      updateCartBadge() {
        const badge = document.getElementById('cart-badge-count');
        if (badge) {
          badge.textContent = this.cart.length;
          if (this.cart.length > 0) badge.classList.remove('hidden');
          else badge.classList.add('hidden');
        }
      }
    }

    window.app = new AlloRamiaApp();
    window.onload = () => { window.app.init(); };
  </script>
</body>
</html>
