	  // MODALE D'ERREUR PERSONNALISÉE (Remplace les alerts natifs)
      showErrorModal(title, message) {
        const existing = document.getElementById('allo-ramia-modal');
        if (existing) existing.remove();

        const modalHTML = `
          <div id="allo-ramia-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
            <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-pink-100 animate-fade-in">
              <div class="flex items-center space-x-3 mb-4">
                <div class="w-12 h-12 rounded-2xl bg-pink-100 flex items-center justify-center text-[#6B125C] text-2xl font-bold">
                  💊
                </div>
                <div>
                  <h3 class="text-base font-bold text-slate-900">${title}</h3>
                  <p class="text-[10px] text-pink-700 uppercase font-bold tracking-wider">Allo Ramia - Service Médical</p>

              </div>
              <div class="bg-pink-50/60 rounded-xl p-4 mb-5 border border-pink-100">

                  ${message}
                </p>
              </div>
              <div class="flex justify-end">
                <button onclick="document.getElementById('allo-ramia-modal').remove()" 
                  class="px-5 py-2.5 bg-[#6B125C] text-white text-xs font-bold rounded-xl hover:bg-[#550e49] transition shadow-md">
                  Compris

        `;
        document.body.insertAdjacentHTML('beforeend', modalHTML);
      }
	  

      cleanExpiredCache() {
        const CACHE_TTL = 24 * 60 * 60 * 1000;
        Object.keys(localStorage).forEach(key => {
          if (key.startsWith('ramia_cache_') && key.endsWith('_time')) {
            const time = parseInt(localStorage.getItem(key) || '0', 10);
            if (Date.now() - time > CACHE_TTL) {
              const dataKey = key.replace('_time', '');
              localStorage.removeItem(key);
              localStorage.removeItem(dataKey);
            }
          }
        });
      }

      showToast(msg) {
        const toast = document.getElementById('toast-notification');
        const msgEl = document.getElementById('toast-message');
        if (toast && msgEl) {
          msgEl.textContent = msg;
          toast.classList.remove('translate-x-full', 'opacity-0');
          setTimeout(() => {
            toast.classList.add('translate-x-full', 'opacity-0');
          }, 3000);
        }
      }

      autoDetectUserLocation(callback) {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              this.currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
              try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();
                
                if (data && data.address) {
                  const countryCode = (data.address.country_code || '').toUpperCase();
                  const detectedCity = data.address.city || data.address.town || data.address.village || data.address.state || '';

                  if (this.countryData[countryCode]) {
                    this.currentCountry = countryCode;
                  }

                  if (detectedCity) {
                    if (detectedCity.toLowerCase().includes('yaound')) this.currentCity = 'Yaoundé';
                    else if (detectedCity.toLowerCase().includes('douala')) this.currentCity = 'Douala';
                    else this.currentCity = detectedCity;
                  }

                  const road = data.address.road || data.address.pedestrian || data.address.footway || '';
                  const suburb = data.address.suburb || data.address.neighbourhood || data.address.quarter || data.address.district || '';
                  
                  let fullLocationString = [road, suburb].filter(Boolean).join(', ');
                  if (fullLocationString) {
                    this.currentDistrict = fullLocationString;
                    const districtInput = document.getElementById('district-input');
                    if (districtInput) districtInput.value = fullLocationString;
                  }
                }
              } catch (e) {
                console.warn("Erreur ou timeout géocodage inverse", e);
              }

              this.syncHeaderSelector();
              this.renderCityDropdown();
              if (typeof callback === 'function') callback();
            },
            (err) => {
              console.warn("GPS non disponible ou refusé:", err);
              this.currentCountry = 'CM';
              this.currentCity = 'Yaoundé';
              this.currentDistrict = ''; 
              this.currentLocation = this.countryData['CM'].cities['Yaoundé'];
              this.syncHeaderSelector();
              this.renderCityDropdown();
              if (typeof callback === 'function') callback();
            },
            { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
          );
        } else {
          this.syncHeaderSelector();
          this.renderCityDropdown();
          if (typeof callback === 'function') callback();
        }
      }

      syncHeaderSelector() {
        const countrySelect = document.getElementById('country-selector');
        if (countrySelect && this.currentCountry) {
          countrySelect.value = this.currentCountry;
        }
      }

      changeCountry(code) {
        this.currentCountry = code;
        const countryInfo = this.countryData[code];
        if (countryInfo) {
          const firstCity = Object.keys(countryInfo.cities)[0];
          this.currentCity = firstCity;
          this.currentLocation = countryInfo.cities[firstCity];
          
          this.currentDistrict = '';
          const districtInput = document.getElementById('district-input');
          if (districtInput) districtInput.value = '';

          this.renderCityDropdown();
          this.initMap();
          this.realPharmacies = [];
          this.updateMapAndCards();
          this.fetchRealPharmaciesOSM(3500, true);
        }
      }

      changeCity(cityName) {
        if (!this.currentCountry) return;
        this.currentCity = cityName;
        const cityCoords = this.countryData[this.currentCountry]?.cities[cityName];
        if (cityCoords) {
          this.currentLocation = cityCoords;
          this.currentDistrict = '';
          const districtInput = document.getElementById('district-input');
          if (districtInput) districtInput.value = '';

          const badgeCityHeader = document.getElementById('header-city-badge');
          if (badgeCityHeader) badgeCityHeader.textContent = this.currentCity;

          this.initMap();
          this.realPharmacies = [];
          this.updateMapAndCards();
          this.fetchRealPharmaciesOSM(3500, true);
        }
      }

      changeTransportFilter(type) {
        this.selectedTransport = type;
        this.updateMapAndCards();
      }

      renderCityDropdown() {
        const citySelect = document.getElementById('active-city-select');
        if (!citySelect) return;

        if (!this.currentCountry || !this.countryData[this.currentCountry]) {
          citySelect.disabled = true;
          citySelect.innerHTML = `<option value="">Veuillez choisir un pays</option>`;
        } else {
          citySelect.disabled = false;
          const countryInfo = this.countryData[this.currentCountry];
          const cityOptions = Object.keys(countryInfo.cities).map(city => 
            `<option value="${city}" ${city === this.currentCity ? 'selected' : ''}>${city}</option>`
          ).join('');
          citySelect.innerHTML = cityOptions;
        }
        
        const badgeCityHeader = document.getElementById('header-city-badge');
        if (badgeCityHeader) {
          badgeCityHeader.textContent = this.currentCity;
        }
      }

      navigateTo(view) {
        this.currentView = view;
        document.getElementById('header-title').textContent = `Allo Ramia - ${view.charAt(0).toUpperCase() + view.slice(1)}`;
        
        ['home', 'ordo', 'sos', 'panier', 'conseils', 'compte'].forEach(v => {
          const btn = document.getElementById(`nav-btn-${v}`);
          if (btn) {
            btn.className = v === view 
              ? "flex flex-col items-center py-1 px-3 text-[#6B125C] font-bold transition" 
              : "flex flex-col items-center py-1 px-3 text-slate-400 hover:text-[#6B125C] font-medium transition";
          }
        });

        const container = document.getElementById('view-container');
        
        if (view === 'home') {
          container.innerHTML = this.renderHomeView();
          setTimeout(() => {
            this.syncHeaderSelector();
            this.initMap();
            this.renderCityDropdown();
            const districtInput = document.getElementById('district-input');
            if (districtInput && this.currentDistrict) {
              districtInput.value = this.currentDistrict;
            }
            this.fetchRealPharmaciesOSM(3500);
          }, 100);
        } else if (view === 'ordo') {
          container.innerHTML = this.renderOrdoView();
        } else if (view === 'sos') {
          container.innerHTML = this.renderSosView();
        } else if (view === 'panier') {
          container.innerHTML = this.renderPanierView();
        } else if (view === 'conseils') {
          container.innerHTML = this.renderConseilsView();
        } else if (view === 'compte') {
          container.innerHTML = this.renderCompteView();
        }
      }

      renderHomeView() {
        return `
          <div class="space-y-6">

      initMap() {
        const container = document.getElementById('osm-map');
        if (!container || !this.currentLocation) return;
        if (this.map) this.map.remove();
        
        this.map = L.map('osm-map', { zoomControl: true }).setView([this.currentLocation.lat, this.currentLocation.lng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(this.map);
      }

      getCurrentGPSLocation() {
        if (this.activeSearchController) {
          this.activeSearchController.abort();
          this.activeSearchController = null;
        }

        const btn = document.getElementById('gps-refresh-btn');
        const icon = document.getElementById('gps-icon');
        if (btn && icon) {
          btn.disabled = true;
          btn.classList.add('opacity-75', 'cursor-wait');
          icon.className = "fa-solid fa-circle-notch fa-spin text-pink-700";
        }

        this.isLoadingPharmacies = false;
        this.autoDetectUserLocation(() => {
          this.renderCityDropdown();
          const districtInput = document.getElementById('district-input');
          if (districtInput) districtInput.value = this.currentDistrict;
          
          this.fetchRealPharmaciesOSM(3500, true).then(() => {
            if (btn && icon) {
              btn.disabled = false;
              btn.classList.remove('opacity-75', 'cursor-wait');
              icon.className = "fa-solid fa-crosshairs text-pink-700";
            }
          });
        });
      }

      async performSearch() {
        const input = document.getElementById('search-input');
        const districtInput = document.getElementById('district-input');

        if (input) this.searchedMedicine = input.value.trim();
        if (districtInput) this.currentDistrict = districtInput.value.trim();

        if (this.currentDistrict !== "") {
          const countryName = this.countryData[this.currentCountry]?.name || "Cameroun";
          const searchAddress = `${this.currentDistrict}, ${this.currentCity}, ${countryName}`;
          try {
            const controllerGeo = new AbortController();
            const timeoutGeo = setTimeout(() => controllerGeo.abort(), 2500);
            const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchAddress)}`, { signal: controllerGeo.signal });
            clearTimeout(timeoutGeo);
            const geoData = await geoRes.json();
            if (geoData && geoData.length > 0) {
              this.currentLocation = { lat: parseFloat(geoData[0].lat), lng: parseFloat(geoData[0].lon) };
            }
          } catch(e) {}
        }

        await this.fetchRealPharmaciesOSM(3500, true);
      }

      cancelSearch() {
        if (this.activeSearchController) {
          this.activeSearchController.abort();
          this.activeSearchController = null;
        }
        this.isLoadingPharmacies = false;
        this.resetSearchButtons();

        const gridHome = document.getElementById('pharmacies-grid');
        if (gridHome) {
          gridHome.innerHTML = `
            <div class="p-4 text-center space-y-2 bg-amber-50 rounded-xl border border-amber-200">
              <i class="fa-solid fa-circle-exclamation text-xl text-amber-600"></i>
              <p class="text-xs font-bold text-amber-800">Recherche interrompue.</p>
              <p class="text-[11px] text-amber-700">Vous pouvez relancer ou affiner votre recherche.</p>
            </div>
          `;
        }
      }

      setSearchStateLoading() {
        const searchBtn = document.getElementById('search-btn');
        const stopBtn = document.getElementById('stop-btn');

        if (searchBtn) {
          searchBtn.disabled = true;
          searchBtn.className = "flex-1 sm:flex-none bg-[#4A0C40] text-pink-200 px-5 py-2.5 rounded-xl text-xs font-bold shadow-inner flex items-center justify-center space-x-2 cursor-wait opacity-90";
          searchBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-sm"></i><span>Recherche...</span>`;
        }
        if (stopBtn) stopBtn.classList.remove('hidden');
      }

      resetSearchButtons() {
        const searchBtn = document.getElementById('search-btn');
        const stopBtn = document.getElementById('stop-btn');

        if (searchBtn) {
          searchBtn.disabled = false;
          searchBtn.className = "flex-1 sm:flex-none bg-white text-[#6B125C] px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-pink-50 transition shadow flex items-center justify-center space-x-2";
          searchBtn.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i><span>Rechercher</span>`;
        }
        if (stopBtn) stopBtn.classList.add('hidden');
      }

      async fetchRealPharmaciesOSM(radius = 3500, forceRefresh = false) {
        if (!this.currentLocation) return;
        
        const lat = this.currentLocation.lat;
        const lng = this.currentLocation.lng;

        const cacheKey = `ramia_cache_${lat.toFixed(2)}_${lng.toFixed(2)}_${radius}`;
        const cacheTimeKey = `${cacheKey}_time`;
        const cachedData = localStorage.getItem(cacheKey);
        const cachedTime = localStorage.getItem(cacheTimeKey);
        const CACHE_TTL = 20 * 60 * 1000;

        if (!forceRefresh && cachedData && cachedTime && (Date.now() - parseInt(cachedTime, 10) < CACHE_TTL)) {
          this.realPharmacies = JSON.parse(cachedData);
          this.isLoadingPharmacies = false;
          this.initMap();
          this.updateMapAndCards();
          return;
        }

        if (this.activeSearchController) {
          this.activeSearchController.abort();
        }
        this.activeSearchController = new AbortController();

        this.searchRadius = radius;
        this.isLoadingPharmacies = true;
        this.setSearchStateLoading();
        this.updateMapAndCards();

        const apiKey = "6faa54ea808d43b7a3c26e7f3fce4da2";
        const url = `https://api.geoapify.com/v2/places?categories=healthcare.pharmacy&filter=circle:${lng},${lat},${radius}&bias=proximity:${lng},${lat}&limit=100&apiKey=${apiKey}`;

        let pharmaciesList = [];

        try {
          const response = await fetch(url, { signal: this.activeSearchController.signal });
          const data = await response.json();

          if (data && data.features) {
            pharmaciesList = data.features.map(f => {
              const props = f.properties;
              const elLat = props.lat;
              const elLon = props.lon;

              const R = 6371;
              const dLat = (elLat - lat) * Math.PI / 180;
              const dLon = (elLon - lng) * Math.PI / 180;
              const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                        Math.cos(lat * Math.PI / 180) * Math.cos(elLat * Math.PI / 180) * 
                        Math.sin(dLon/2) * Math.sin(dLon/2);
              const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
              const distanceKm = R * c;

              const streetNum = props.housenumber || '';
              const streetName = props.street || props.address_line1 || '';
              const quartier = props.suburb || props.district || props.neighbourhood || '';
              
              let constructedAddress = props.formatted;
              if (streetName || quartier) {
                const parts = [];
                if (streetNum || streetName) {
                  parts.push([streetNum, streetName].filter(Boolean).join(' '));
                }
                if (quartier) {
                  parts.push(`Quartier ${quartier}`);
                }
                if (props.city && !parts.join('').includes(props.city)) {
                  parts.push(props.city);
                }
                if (parts.length > 0) {
                  constructedAddress = parts.join(' - ');
                }
              }

              let pharmacyName = props.name || props.amenity || props.brand || null;
              if (!pharmacyName || pharmacyName.toLowerCase() === 'pharmacy' || pharmacyName.toLowerCase() === 'pharmacie') {
                pharmacyName = quartier ? `Pharmacie (${quartier})` : "Pharmacie de Proximité";
              }

              const phone = props.contact?.phone || props.datasource?.raw?.phone || props.phone || null;
              const website = props.website || props.datasource?.raw?.website || null;
              const openingHours = props.opening_hours || props.datasource?.raw?.opening_hours || null;

              return {
                id: props.place_id || Math.random(),
                name: pharmacyName,
                phone: phone,
                email: props.contact?.email || null,
                website: website,
                openingHours: openingHours,
                brand: props.brand || null,
                address: constructedAddress || "Adresse non renseignée",
                lat: elLat,
                lng: elLon,
                distance: distanceKm
              };
            });

            this.realPharmacies = pharmaciesList.sort((a, b) => a.distance - b.distance);
            this.isLoadingPharmacies = false;
            this.resetSearchButtons();
            this.initMap();
            this.updateMapAndCards();

            data.features.forEach(async (f) => {
              const props = f.properties;
              const elLat = props.lat;
              const elLon = props.lon;
              const pId = props.place_id;

              try {
                const routeUrl = `https://api.geoapify.com/v1/routing?waypoints=${lat},${lng}|${elLat},${elLon}&mode=drive&apiKey=${apiKey}`;
                const routeRes = await fetch(routeUrl);
                const routeData = await routeRes.json();
                if (routeData && routeData.features && routeData.features.length > 0) {
                  const exactDistanceKm = routeData.features[0].properties.distance / 1000;
                  
                  const targetPharmacy = this.realPharmacies.find(p => p.id === pId);
                  if (targetPharmacy) {
                    targetPharmacy.distance = exactDistanceKm;
                    this.realPharmacies.sort((a, b) => a.distance - b.distance);
                    this.updateMapAndCards();
                  }
                }
              } catch (e) {}
            });
          }
        } catch (err) {
          if (err.name !== 'AbortError') {
            console.warn("Erreur lors de la récupération Geoapify", err);
          }
        }

        try {
          localStorage.setItem(cacheKey, JSON.stringify(this.realPharmacies));
          localStorage.setItem(cacheTimeKey, Date.now().toString());
        } catch (e) {}

        this.isLoadingPharmacies = false;
        this.resetSearchButtons();
        this.initMap();
        this.updateMapAndCards();
      }

      updateMapAndCards() {
        if (this.currentView === 'home' && this.map && this.currentLocation) {
          this.map.setView([this.currentLocation.lat, this.currentLocation.lng], 14);
          if (this.userMarker) this.map.removeLayer(this.userMarker);
          
          this.userMarker = L.circleMarker([this.currentLocation.lat, this.currentLocation.lng], {
            radius: 8, fillColor: "#A1197A", color: "#FFFFFF", weight: 2.5, fillOpacity: 0.95
          }).addTo(this.map);

          this.mapMarkers.forEach(m => this.map.removeLayer(m));
          this.mapMarkers = [];

          this.realPharmacies.forEach(p => {
            const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${this.currentLocation.lat},${this.currentLocation.lng}&destination=${p.lat},${p.lng}&travelmode=driving`;
            const marker = L.marker([p.lat, p.lng]).addTo(this.map);
            
            const popupContent = `
              <div style="white-space: normal; word-break: break-word;" class="space-y-1">
                <strong class="text-xs text-[#6B125C] font-bold block">${p.name}</strong>
                <p class="text-[10px] text-slate-600 font-normal leading-tight">${p.address}</p>
                <div class="flex items-center justify-between pt-1 mt-1 border-t border-slate-100">
                  <span class="text-[10px] text-emerald-600 font-bold">À ${p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km'}</span>
                  <a href="${mapsUrl}" target="_blank" class="text-[9px] bg-[#6B125C] text-white px-2 py-0.5 rounded font-bold hover:bg-pink-700 shadow-sm">GPS</a>
                </div>
              </div>
            `;

            marker.bindTooltip(`
              <div style="font-size: 11px; font-weight: bold; color: #6B125C;">
                <i class="fa-solid fa-pills mr-1"></i> ${p.name}
              </div>
              <div style="font-size: 10px; color: #64748b;">
                À ${p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km'}
              </div>
            `, { direction: 'top', offset: [0, -10] });

            marker.bindPopup(popupContent, { maxWidth: 320 });
            this.mapMarkers.push(marker);
          });
        }

        const gridHome = document.getElementById('pharmacies-grid');
        const radiusBadge = document.getElementById('radius-badge');
        const countBadge = document.getElementById('pharmacy-count-badge');

        if (radiusBadge) radiusBadge.textContent = `Rayon : ${(this.searchRadius/1000).toFixed(1)} km`;
	
        if (countBadge) {
          const totalFound = this.realPharmacies.length;
          countBadge.textContent = `${totalFound} pharmacie${totalFound > 1 ? 's' : ''}`;
        }

        let htmlCards = "";
        if (this.isLoadingPharmacies) {
          const locText = this.currentDistrict ? `${this.currentDistrict} (${this.currentCity})` : `${this.currentCity}`;
          htmlCards = `
            <div class="p-5 text-center space-y-2 bg-pink-50/50 rounded-2xl border border-pink-100">
              <i class="fa-solid fa-circle-notch fa-spin text-2xl text-[#6B125C]"></i>
              <p class="text-xs font-bold text-slate-800">Recherche rapide autour de ${locText}...</p>
            </div>
          `;
        } else if (this.realPharmacies.length === 0) {
          htmlCards = `
            <div class="p-5 text-center space-y-3 bg-amber-50 rounded-2xl border border-amber-200">
              <i class="fa-solid fa-triangle-exclamation text-2xl text-amber-600"></i>
              <p class="text-xs font-bold text-amber-900">Aucune pharmacie n'a été trouvée automatiquement dans le rayon de 3.5 km.</p>
              <p class="text-[11px] text-amber-700">Sélectionnez votre ville ou saisissez votre quartier ci-dessus pour relancer la recherche.</p>
              <button id="gps-refresh-btn" onclick="window.app.getCurrentGPSLocation()" class="text-xs bg-pink-50 text-[#6B125C] hover:bg-pink-100 px-3 py-1.5 rounded-lg font-bold transition flex items-center space-x-1 border border-pink-200 mx-auto">
                <i id="gps-icon" class="fa-solid fa-crosshairs text-pink-700"></i>
                <span>Réactualiser Position GPS</span>
              </button>
            </div>
          `;
        } else {
          const currentCountryInfo = this.countryData[this.currentCountry] || this.countryData['CM'];
          const paymentList = currentCountryInfo.paymentMethods || ['Mobile Money'];
          const currencyLabel = currentCountryInfo.currency || 'XAF';

          htmlCards = this.realPharmacies.map(p => {
            const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${this.currentLocation.lat},${this.currentLocation.lng}&destination=${p.lat},${p.lng}&travelmode=driving`;
            const distLabel = p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km';
            
            const searchedMedName = this.searchedMedicine ? this.searchedMedicine : "Médicament demandé";
            
            const basePrice = 2500; 
            const randomVariation = ((p.id ? String(p.id).charCodeAt(0) : 5) % 5) * 150;

            const distKm = p.distance;
            const yangoMotoPrice = Math.max(300, Math.round(distKm * 250 / 100) * 100); 
            const yangoTaxiPrice = Math.max(1000, Math.round(distKm * 500 / 100) * 100); 
            const gozemPrice = Math.max(350, Math.round(distKm * 280 / 100) * 100);

                      <span>🏍️ Gozem</span>

      addToCart(name, price, pharmacyName) {
        this.cart.push({ id: Date.now(), name: `${name} (${pharmacyName})`, price: price, qty: 1 });

        this.showToast(`Ajouté : ${name}`);
      }

    // MODULE D'ANALYSE D'ORDONNANCE VIA SERVER.JS & GPT-4O VISION
      async simulateIAScan(input) {
        if (input.files && input.files[0]) {
          const file = input.files[0];
          const loadingBox = document.getElementById('ia-loading-box');
          const box = document.getElementById('ia-result-box');
          const list = document.getElementById('ia-meds-list');
          
          if (loadingBox) {
            loadingBox.classList.remove('hidden');
            const statusText = loadingBox.querySelector('p');
            if (statusText) statusText.textContent = "Analyse de l'ordonnance par l'IA GPT-4o en cours...";
          }
          if (box) box.classList.add('hidden');

          try {
            const formData = new FormData();
            formData.append('image', file);

            // Appel dynamique vers l'API Node.js
            const response = await fetch('/api/analyze-prescription', {
              method: 'POST',
              body: formData
            });

            const data = await response.json();

            if (!response.ok) {
              throw new Error(data.error || `Erreur serveur HTTP: ${response.status}`);
            }
	
            console.log("Résultat extrait par GPT-4o :", data);

            // Récupération de la liste des médicaments retournée par le serveur
            if (data.medicaments && data.medicaments.length > 0) {
              this.detectedMedsList = data.medicaments;
            } else {
              this.detectedMedsList = ["Aucun médicament lisible trouvé"];
            }

            if (loadingBox) loadingBox.classList.add('hidden');
            if (box && list) {
              box.classList.remove('hidden');
              list.innerHTML = this.detectedMedsList.map(med => `
                <li class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-emerald-100 shadow-sm">
                  <span>💊 <strong>${med}</strong></span>
                  <span class="text-[10px] text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded font-bold">Extrait par GPT-4o</span>
                </li>
              `).join('');

              this.searchedMedicine = this.detectedMedsList.join(', ');
            }

          } catch (err) {
            console.error("Erreur d'analyse backend :", err);
            if (loadingBox) loadingBox.classList.add('hidden');
            // Affiche la jolie modale personnalisée au lieu de l'alert natif
            this.showErrorModal("Information importante", err.message); 
          }
        }
      }

      validatePhoneNumber(phone) {
        const cleaned = phone.replace(/\D/g, '');
        return cleaned.length >= 8 && cleaned.length <= 10;
      }

      navigateToStep2() {
        const nom = document.getElementById('ordo-nom')?.value.trim();
        const tel = document.getElementById('ordo-tel')?.value.trim();
        
        if (!nom || !tel) {
          this.showErrorModal("Champs requis", "Veuillez remplir le nom et le téléphone WhatsApp du bénéficiaire.");
		  return;
        }

        if (!this.validatePhoneNumber(tel)) {
          alert("Veuillez saisir un numéro de téléphone valide pour le pays sélectionné.");
          return;
        }
        
        this.beneficiaire = { nom, tel };
        this.navigateTo('home');
      }
