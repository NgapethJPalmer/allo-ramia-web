      init() {
        this.updateCartBadge();
        this.autoDetectUserLocation(() => {
          this.navigateTo('home');
        });
      }

      showToast(msg) {
        const toast = document.getElementById('toast-notification');
        const msgEl = document.getElementById('toast-message');
        if (toast && msgEl) {
          msgEl.textContent = msg;
          toast.classList.remove('translate-x-full', 'opacity-0');
          setTimeout(() => {
            toast.classList.add('translate-x-full', 'opacity-0');
          }, 3000);
        }
      }

      cleanExpiredCache() {
        const CACHE_TTL = 24 * 60 * 60 * 1000;
        Object.keys(localStorage).forEach(key => {
          if (key.startsWith('ramia_cache_') && key.endsWith('_time')) {
            const time = parseInt(localStorage.getItem(key) || '0', 10);
            if (Date.now() - time > CACHE_TTL) {
              const dataKey = key.replace('_time', '');
              localStorage.removeItem(key);
              localStorage.removeItem(dataKey);
            }
          }
        });
      }

      toggleDiasporaMode() {
        this.isDiasporaMode = !this.isDiasporaMode;
        this.showToast(this.isDiasporaMode ? "Mode Diaspora activé : Commande à distance" : "Mode Standard activé");
        this.navigateTo('home');
      }

      autoDetectUserLocation(callback) {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              this.currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
              try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                const data = await res.json();
                if (data && data.address) {
                  const countryCode = (data.address.country_code || '').toUpperCase();
                  const detectedCity = data.address.city || data.address.town || data.address.village || data.address.state || '';
                  if (this.countryData[countryCode]) this.currentCountry = countryCode;
                  if (detectedCity) {
                    if (detectedCity.toLowerCase().includes('douala')) this.currentCity = 'Douala';
                    else if (detectedCity.toLowerCase().includes('yaound')) this.currentCity = 'Yaoundé';
                    else this.currentCity = detectedCity;
                  }
                  const road = data.address.road || data.address.pedestrian || '';
                  const suburb = data.address.suburb || data.address.neighbourhood || '';
                  let fullLocationString = [road, suburb].filter(Boolean).join(', ');
                  if (fullLocationString) {
                    this.currentDistrict = fullLocationString;
                    const districtInput = document.getElementById('district-input');
                    if (districtInput) districtInput.value = fullLocationString;
                  }
                }
              } catch (e) {}
              this.syncHeaderSelector();
              this.renderCityDropdown();
              if (typeof callback === 'function') callback();
            },
            () => {
              this.currentCountry = 'CM';
              this.currentCity = 'Douala';
              this.currentDistrict = 'Akwa / Rue Kotto'; 
              this.currentLocation = this.countryData['CM'].cities['Douala'];
              this.syncHeaderSelector();
              this.renderCityDropdown();
              if (typeof callback === 'function') callback();
            },
            { enableHighAccuracy: true, timeout: 7000, maximumAge: 0 }
          );
        } else {
          this.syncHeaderSelector();
          this.renderCityDropdown();
          if (typeof callback === 'function') callback();
        }
      }

      syncHeaderSelector() {
        const countrySelect = document.getElementById('country-selector');
        if (countrySelect && this.currentCountry) countrySelect.value = this.currentCountry;
      }

      changeCountry(code) {
        this.currentCountry = code;
        const countryInfo = this.countryData[code];
        if (countryInfo) {
          const firstCity = Object.keys(countryInfo.cities)[0];
          this.currentCity = firstCity;
          this.currentLocation = countryInfo.cities[firstCity];
          this.currentDistrict = '';
          const districtInput = document.getElementById('district-input');
          if (districtInput) districtInput.value = '';
          this.renderCityDropdown();
          this.initMap();
          this.realPharmacies = [];
          this.updateMapAndCards();
          this.fetchRealPharmaciesOSM(3500, true);
        }
      }

      changeCity(cityName) {
        if (!this.currentCountry) return;
        this.currentCity = cityName;
        const cityCoords = this.countryData[this.currentCountry]?.cities[cityName];
        if (cityCoords) {
          this.currentLocation = cityCoords;
          this.currentDistrict = '';
          const districtInput = document.getElementById('district-input');
          if (districtInput) districtInput.value = '';
          const badgeCityHeader = document.getElementById('header-city-badge');
          if (badgeCityHeader) badgeCityHeader.textContent = this.currentCity;
          this.initMap();
          this.realPharmacies = [];
          this.updateMapAndCards();
          this.fetchRealPharmaciesOSM(3500, true);
        }
      }

      changeTransportFilter(type) {
        this.selectedTransport = type;
        this.updateMapAndCards();
      }

      renderCityDropdown() {
        const citySelect = document.getElementById('active-city-select');
        if (!citySelect) return;
        if (!this.currentCountry || !this.countryData[this.currentCountry]) {
          citySelect.disabled = true;
          citySelect.innerHTML = `<option value="">Veuillez choisir un pays</option>`;
        } else {
          citySelect.disabled = false;
          const countryInfo = this.countryData[this.currentCountry];
          const cityOptions = Object.keys(countryInfo.cities).map(city => 
            `<option value="${city}" ${city === this.currentCity ? 'selected' : ''}>${city}</option>`
          ).join('');
          citySelect.innerHTML = cityOptions;
        }
        const badgeCityHeader = document.getElementById('header-city-badge');
        if (badgeCityHeader) badgeCityHeader.textContent = this.currentCity;
      }

      navigateTo(view) {
        this.currentView = view;
        const titleMap = {
          home: 'Accueil - Géolocalisation & Officines',
          laborex: 'Catalogue Laborex (100 Références HT/TTC)',
          ordo: "Scan & Extraction d'Ordonnance IA",
          tunnel: 'Tunnel de Commande V5 (Étapes 1 à 6)',
          sos: 'Pharmacies de Garde & SOS Urgences',
          panier: 'Panier, Devis Comparatif & Validation',
          compte: 'Espace Client & Historique'
        };
        document.getElementById('header-title').textContent = `Allo Ramia - ${titleMap[view] || view}`;

        ['home', 'laborex', 'ordo', 'tunnel', 'sos', 'panier', 'compte'].forEach(v => {
          const btn = document.getElementById(`nav-btn-${v}`);
          if (btn) {
            btn.className = v === view 
              ? "flex flex-col items-center py-1 px-2 text-[#6B125C] font-bold transition" 
              : "flex flex-col items-center py-1 px-2 text-slate-400 hover:text-[#6B125C] font-medium transition";
          }
        });

        const container = document.getElementById('view-container');
        if (view === 'home') {
          container.innerHTML = this.renderHomeView();
          setTimeout(() => {
            this.syncHeaderSelector();
            this.initMap();
            this.renderCityDropdown();
            const districtInput = document.getElementById('district-input');
            if (districtInput && this.currentDistrict) districtInput.value = this.currentDistrict;
            this.fetchRealPharmaciesOSM(3500);
          }, 100);
        } else if (view === 'laborex') {
          container.innerHTML = this.renderLaborexView();
        } else if (view === 'ordo') {
          container.innerHTML = this.renderOrdoView();
        } else if (view === 'tunnel') {
          container.innerHTML = this.renderTunnelView();
        } else if (view === 'sos') {
          container.innerHTML = this.renderSosView();
        } else if (view === 'panier') {
          container.innerHTML = this.renderPanierView();
        } else if (view === 'compte') {
          container.innerHTML = this.renderCompteView();
        }
      }

      renderLaborexRows(items) {
        return items.map(m => `
          <tr class="hover:bg-pink-50/50 transition">
            <td class="p-3 font-mono text-[11px] font-bold text-slate-500">${m.code}</td>
            <td class="p-3 font-bold text-slate-800">${m.name}</td>
            <td class="p-3 text-slate-600">${m.form}</td>
            <td class="p-3 text-slate-500">${m.ht.toLocaleString()} FCFA</td>
            <td class="p-3 font-extrabold text-[#6B125C]">${m.ttc.toLocaleString()} FCFA</td>
            <td class="p-3 text-center">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">${m.disp}</span>
            </td>
            <td class="p-3 text-center">
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${m.reqRx === 'Oui' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-700'}">
                ${m.reqRx === 'Oui' ? 'Requise' : 'Libre'}
              </span>
            </td>
            <td class="p-3 text-center">
              <button onclick="window.app.addToCart('${m.name.replace(/'/g, "\'")}', ${m.ttc}, 'Dépôt Laborex Central')" class="bg-[#6B125C] text-white text-[10px] font-bold px-3 py-1.5 rounded-lg hover:bg-pink-800 transition shadow">+ Panier</button>
            </td>
          </tr>
        `).join('');
      }

      filterLaborexTable() {
        const query = document.getElementById('laborex-search-input')?.value.toLowerCase() || '';
        const cat = document.getElementById('laborex-cat-filter')?.value || '';
        const filtered = this.laborexCatalog.filter(m => {
          const matchQuery = m.name.toLowerCase().includes(query) || m.code.toLowerCase().includes(query) || m.cat.toLowerCase().includes(query);
          const matchCat = cat === '' || m.cat.includes(cat);
          return matchQuery && matchCat;
        });
        const tbody = document.getElementById('laborex-table-body');
        if (tbody) tbody.innerHTML = this.renderLaborexRows(filtered);
      }

async handleOrdoUpload(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        this.isOrdoLoading = true;
        this.navigateTo('ordo');
        this.showToast("Analyse experte de l'ordonnance par IA en cours...");

        try {
          // 1. Conversion du fichier image en Base64
          const base64Data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
            reader.readAsDataURL(file);
          });

          // 2. Appel direct à l'API Gemini Vision pour extraction exclusive des médicaments
          const apiKey = "AIzaSyAkJB6hhLiF-2K_BfzjayR1Ll6WOJMm3wM"; // Votre clé API Firebase / Gemini
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

          const promptText = "Analyse cette ordonnance médicale manuscrite. Ignore complètement les en-têtes administratifs (ministère, hôpital, nom du patient, date, codes). Extrais uniquement les noms stricts des médicaments prescrits (ex: Fenostrae, Trikorix, Dynamogen, Anphos). Ne retourne aucune posologie (pas de '1 càs', pas de 'x2/j'). Réponds uniquement sous forme de liste de noms de médicaments séparés par des virgules.";

          const payload = {
            contents: [
              {
                parts: [
                  { text: promptText },
                  {
                    inlineData: {
                      mimeType: file.type || "image/jpeg",
                      data: base64Data
                    }
                  }
                ]
              }
            ]
          };

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();
          const textResponse = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";

          // 3. Traitement de la réponse de l'IA
          const extractedMeds = textResponse
            .split(/[,;\n]/)
            .map(m => m.replace(/^[\-\•\*\d+\.\)]+\s*/, '').trim())
            .filter(m => m.length > 2);

          if (extractedMeds.length > 0) {
            this.detectedMedsList = extractedMeds.map(medName => ({
              name: medName,
              price: 2500
            }));
            this.showToast(`Succès : ${this.detectedMedsList.length} médicament(s) identifié(s) par l'IA !`);
          } else {
            this.detectedMedsList = [{ name: "Médicament à préciser", price: 2500 }];
            this.showToast("L'écriture manuscrite est trop floue. Veuillez l'ajuster.");
          }

        } catch (error) {
          console.error("Erreur analyse IA :", error);
          this.showToast("Erreur lors de l'analyse intelligente de l'ordonnance.");
          this.detectedMedsList = [];
        } finally {
          this.isOrdoLoading = false;
          this.navigateTo('ordo');
        }
      }

      updateDetectedMedName(index, newName) {
        if (this.detectedMedsList[index]) {
          this.detectedMedsList[index].name = newName;
        }
      }

      updateDetectedMedPrice(index, newPrice) {
        if (this.detectedMedsList[index]) {
          this.detectedMedsList[index].price = parseFloat(newPrice) || 0;

      removeDetectedMed(index) {

        this.navigateTo('panier');
      }

      updateCartBadge() {
        const badge = document.getElementById('cart-badge-count');
        if (badge) {
          badge.textContent = this.cart.length;
          if (this.cart.length > 0) badge.classList.remove('hidden');
          else badge.classList.add('hidden');
        }
      }

      initMap() {
        const container = document.getElementById('osm-map');
        if (!container || !this.currentLocation) return;
        if (this.map) this.map.remove();
        this.map = L.map('osm-map', { zoomControl: true }).setView([this.currentLocation.lat, this.currentLocation.lng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(this.map);
      }

      getCurrentGPSLocation() {
        if (this.activeSearchController) {
          this.activeSearchController.abort();
          this.activeSearchController = null;
        }
        const btn = document.getElementById('gps-refresh-btn');
        const icon = document.getElementById('gps-icon');
        if (btn && icon) {
          btn.disabled = true;
          icon.className = "fa-solid fa-circle-notch fa-spin text-pink-700";
        }
        this.isLoadingPharmacies = false;
        this.autoDetectUserLocation(() => {
          this.renderCityDropdown();
          const districtInput = document.getElementById('district-input');
          if (districtInput) districtInput.value = this.currentDistrict;
          this.fetchRealPharmaciesOSM(3500, true).then(() => {
            if (btn && icon) {
              btn.disabled = false;
              icon.className = "fa-solid fa-crosshairs text-pink-700";
            }
          });
        });
      }

      async performSearch() {
        const input = document.getElementById('search-input');
        const districtInput = document.getElementById('district-input');
        if (input) this.searchedMedicine = input.value.trim();
        if (districtInput) this.currentDistrict = districtInput.value.trim();

        // 1. MISE A JOUR VISUELLE IMMEDIATE (0ms)
        this.isLoadingPharmacies = true;
        this.setSearchStateLoading();

        // 2. On laisse le navigateur afficher l'animation du bouton AVANT de lancer les requêtes réseau
        setTimeout(async () => {
          if (this.currentDistrict !== "") {
            const countryName = this.countryData[this.currentCountry]?.name || "Cameroun";
            const searchAddress = `${this.currentDistrict}, ${this.currentCity}, ${countryName}`;
            try {
              const controllerGeo = new AbortController();
              const timeoutGeo = setTimeout(() => controllerGeo.abort(), 2500);
              const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchAddress)}`, { signal: controllerGeo.signal });
              clearTimeout(timeoutGeo);
              const geoData = await geoRes.json();
              if (geoData && geoData.length > 0) {
                this.currentLocation = { lat: parseFloat(geoData[0].lat), lng: parseFloat(geoData[0].lon) };
              }
            } catch(e) {}
          }
          await this.fetchRealPharmaciesOSM(3500, true);
        }, 50);
      }
	  

      cancelSearch() {
        if (this.activeSearchController) {
          this.activeSearchController.abort();
          this.activeSearchController = null;
        }
        this.isLoadingPharmacies = false;
        this.resetSearchButtons();
      }

      setSearchStateLoading() {
        const searchBtn = document.getElementById('search-btn');
        const stopBtn = document.getElementById('stop-btn');
        if (searchBtn) {
          searchBtn.disabled = true;
          searchBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-sm"></i><span>Recherche...</span>`;
        }
        if (stopBtn) stopBtn.classList.remove('hidden');
      }

      resetSearchButtons() {
        const searchBtn = document.getElementById('search-btn');
        const stopBtn = document.getElementById('stop-btn');
        if (searchBtn) {
          searchBtn.disabled = false;
          searchBtn.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i><span>Rechercher</span>`;
        }
        if (stopBtn) stopBtn.classList.add('hidden');
      }

      async fetchRealPharmaciesOSM(radius = 3500, forceRefresh = false) {
        if (!this.currentLocation) return;
        const lat = this.currentLocation.lat;
        const lng = this.currentLocation.lng;

        const cacheKey = `ramia_cache_${lat.toFixed(2)}_${lng.toFixed(2)}_${radius}`;
        const cacheTimeKey = `${cacheKey}_time`;
        const cachedData = localStorage.getItem(cacheKey);
        const cachedTime = localStorage.getItem(cacheTimeKey);
        const CACHE_TTL = 20 * 60 * 1000;

        if (!forceRefresh && cachedData && cachedTime && (Date.now() - parseInt(cachedTime, 10) < CACHE_TTL)) {
          this.realPharmacies = JSON.parse(cachedData);
          this.isLoadingPharmacies = false;
          this.initMap();
          this.updateMapAndCards();
          return;
        }

        if (this.activeSearchController) this.activeSearchController.abort();
        this.activeSearchController = new AbortController();

        this.searchRadius = radius;
        this.isLoadingPharmacies = true;
        this.setSearchStateLoading();
        this.updateMapAndCards();

        const apiKey = "6faa54ea808d43b7a3c26e7f3fce4da2";
        const url = `https://api.geoapify.com/v2/places?categories=healthcare.pharmacy&filter=circle:${lng},${lat},${radius}&bias=proximity:${lng},${lat}&limit=100&apiKey=${apiKey}`;

        let pharmaciesList = [];
        try {
          const response = await fetch(url, { signal: this.activeSearchController.signal });
          const data = await response.json();
          
          if (data && data.features) {
            // Traitement initial des pharmacies récupérées
            const rawPharmacies = data.features.map(f => {
              const props = f.properties;
              const elLat = props.lat;
              const elLon = props.lon;
              const quartier = props.suburb || props.district || props.neighbourhood || '';
              let constructedAddress = props.formatted || "Adresse non renseignée";
              let pharmacyName = props.name || props.amenity || props.brand || (quartier ? `Pharmacie (${quartier})` : "Pharmacie de Proximité");

              // Estimation rapide initiale pour le tri préalable
              const dLat = (elLat - lat) * Math.PI / 180;
              const dLon = (elLon - lng) * Math.PI / 180;
              const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat * Math.PI / 180) * Math.cos(elLat * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
              const approxDistance = 6371 * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));

              return {
                id: props.place_id || Math.random(),
                name: pharmacyName,
                phone: props.contact?.phone || props.phone || props.datasource?.raw?.phone || null,
                email: props.contact?.email || props.email || props.datasource?.raw?.email || null,
                website: props.contact?.website || props.website || props.datasource?.raw?.website || null,
                address: constructedAddress,
                lat: elLat,
                lng: elLon,
                distance: approxDistance, // Sera remplacé par la vraie distance routière
                durationMinutes: null
              };
            });

            // Sélection des 15 officines les plus proches pour calcul du trajet routier réel via OSRM
            const topPharmacies = rawPharmacies.sort((a, b) => a.distance - b.distance).slice(0, 15);

            // Calcul du trajet routier réel (OSRM Road Routing)
            // Calcul du trajet routier réel (OSRM Road Routing)
            pharmaciesList = await Promise.all(topPharmacies.map(async (p) => {
              try {
                const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${lng},${lat};${p.lng},${p.lat}?overview=false`;
                const osrmRes = await fetch(osrmUrl);
                const osrmData = await osrmRes.json();
                if (osrmData && osrmData.routes && osrmData.routes.length > 0) {
                  const realDistanceKm = osrmData.routes[0].distance / 1000; // mètres vers km
                  const realDurationMin = Math.round(osrmData.routes[0].duration / 60); // secondes vers minutes
                  return {
                    ...p,
                    distance: realDistanceKm,
                    durationMinutes: realDurationMin,
                    isRoadDistance: true
                  };
                }
              } catch (e) {}
              return p;
            }));

            // FILTRE STRICT : On ne garde que les pharmacies dont la distance routière réelle est <= au rayon (ex: 3.5 km)
            const maxRadiusKm = radius / 1000;
            this.realPharmacies = pharmaciesList
              .filter(p => p.distance <= maxRadiusKm)
              .sort((a, b) => a.distance - b.distance);
			  
          }
        } catch (err) {}

        try {
          localStorage.setItem(cacheKey, JSON.stringify(this.realPharmacies));
          localStorage.setItem(cacheTimeKey, Date.now().toString());
        } catch (e) {}

        this.isLoadingPharmacies = false;
        this.resetSearchButtons();
        this.initMap();
        this.updateMapAndCards();
      }
	  

      updateMapAndCards() {
        if (this.currentView === 'home' && this.map && this.currentLocation) {
          this.map.setView([this.currentLocation.lat, this.currentLocation.lng], 14);
          if (this.userMarker) this.map.removeLayer(this.userMarker);
          this.userMarker = L.circleMarker([this.currentLocation.lat, this.currentLocation.lng], {
            radius: 8, fillColor: "#A1197A", color: "#FFFFFF", weight: 2.5, fillOpacity: 0.95
          }).addTo(this.map);

          this.mapMarkers.forEach(m => this.map.removeLayer(m));
          this.mapMarkers = [];

          this.realPharmacies.forEach(p => {
            const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
            const marker = L.marker([p.lat, p.lng]).addTo(this.map);
            marker.bindPopup(`<strong style="color: #6B125C;">${p.name}</strong><br><small>${p.address}</small><br><a href="${mapsUrl}" target="_blank">Y aller</a>`);
            this.mapMarkers.push(marker);
          });
        }

        const gridHome = document.getElementById('pharmacies-grid');
        const countBadge = document.getElementById('pharmacy-count-badge');
        if (countBadge) countBadge.textContent = `${this.realPharmacies.length} pharmacie(s)`;

        if (!gridHome) return;
        if (this.isLoadingPharmacies) {
          gridHome.innerHTML = `<div class="p-5 text-center"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-[#6B125C]"></i></div>`;
          return;
        }

        if (this.realPharmacies.length === 0) {
          gridHome.innerHTML = `<div class="p-5 text-center text-xs text-amber-800 bg-amber-50 rounded-xl">Aucune pharmacie trouvée dans le rayon de 3.5 km.</div>`;
          return;
        }

        const currencyLabel = (this.countryData[this.currentCountry] || {}).currency || 'XAF';
        const hasSearched = this.searchedMedicine && this.searchedMedicine.trim() !== "";

        gridHome.innerHTML = this.realPharmacies.map((p, idx) => {
          const medPrice = 2500;
          const serviceFee = Math.round(medPrice * 0.05); // Commission à 5%
          const subTotalWithoutTransport = medPrice + serviceFee;
          const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;

          return `
            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm space-y-3">
              <div class="flex flex-col sm:flex-row justify-between items-start gap-2">
                <div>
                  <h4 class="font-bold text-[#6B125C] text-xs sm:text-sm">💊 ${p.name}</h4>
                  <p class="text-[11px] text-slate-600 mt-0.5">${p.address}</p>
                  
                  <div class="flex flex-wrap gap-4 mt-2.5 text-[11px] text-slate-500 bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                    <span class="flex items-center gap-1.5">
                      <i class="fa-solid fa-phone text-pink-600"></i> 
                      ${p.phone ? `<a href="tel:${p.phone}" class="hover:underline font-semibold text-slate-700">${p.phone}</a>` : '<span class="text-slate-400 italic">Téléphone : Non disponible</span>'}
                    </span>
                    <span class="flex items-center gap-1.5">
                      <i class="fa-solid fa-envelope text-pink-600"></i> 
                      ${p.email ? `<a href="mailto:${p.email}" class="hover:underline text-slate-700">${p.email}</a>` : '<span class="text-slate-400 italic">E-mail : Non disponible</span>'}
                    </span>
                    <span class="flex items-center gap-1.5">
                      <i class="fa-solid fa-globe text-pink-600"></i> 
                      ${p.website ? `<a href="${p.website}" target="_blank" class="hover:underline text-[#6B125C] font-semibold">Site web</a>` : '<span class="text-slate-400 italic">Site web : Non disponible</span>'}
                    </span>
                  </div>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  <a href="${mapsUrl}" target="_blank" class="px-3 py-1.5 bg-pink-50 text-[#6B125C] hover:bg-pink-100 rounded-lg text-xs font-bold transition flex items-center gap-1 border border-pink-200">
                    <i class="fa-solid fa-location-dot"></i> Voir la position
                  </a>
                  
				 <span class="text-xs bg-emerald-50 text-emerald-700 font-bold px-2.5 py-1 rounded-full"> À ${p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km'}</span>

				</div>
              </div>

              ${hasSearched ? `
                <div class="flex justify-between items-center bg-pink-50/50 p-3 rounded-xl text-xs border border-pink-100">
                  <span>Estimation (${this.searchedMedicine}) + Service (5%) : <strong class="text-[#6B125C]">${subTotalWithoutTransport.toLocaleString()} ${currencyLabel}</strong> <span class="text-[10px] text-slate-500">(Hors transport)</span></span>
                  <button onclick="window.app.addToCart('${this.searchedMedicine.replace(/'/g, "\'")}', ${subTotalWithoutTransport}, '${p.name.replace(/'/g, "\'")}')" class="bg-[#6B125C] text-white px-3.5 py-1.5 rounded-lg font-bold text-xs shadow hover:bg-pink-800 transition">Commander</button>
                </div>
              ` : `
                <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl text-xs border border-slate-200 text-slate-500">
                  <span><em>Saisissez un médicament ci-dessus pour afficher le tarif et commander.</em></span>
                  <button onclick="window.app.tunnelData.step2_pharmacy='${p.name.replace(/'/g, "\'")}'; window.app.setTunnelStep(1);" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-1.5 rounded-lg font-bold text-xs transition">Sélectionner</button>
                </div>
              `}
            </div>
          `;
        }).join('');
      }
    }

    // INITIALISATION APPLICATIVE GLOBALE
    window.app = new AlloRamiaApp();
    window.onload = () => { 
      window.app.init(); 
    };
  </script>
  <!-- FIN DE L'ARCHITECTURE APPLICATIVE INTEGRALE ALLO RAMIA -->
</body>
</html>
