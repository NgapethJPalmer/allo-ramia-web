  <!-- SCRIPT ENGINE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAkJB6hhLiF-2K_BfzjayR1Ll6WOJMm3wM",
      authDomain: "allo-ramia.firebaseapp.com",
      projectId: "allo-ramia",
      storageBucket: "allo-ramia.firebasestorage.app",
      messagingSenderId: "203296803502",
      appId: "1:203296803502:web:2080779ac6306918d8fb3f"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const firebaseDb = getFirestore(firebaseApp);

    class AlloRamiaApp {
      constructor() {
        this.currentView = 'home';
        this.map = null;
        this.mapMarkers = [];
        this.userMarker = null;
        this.currentLocation = { lat: 3.8480, lng: 11.5021 };
        this.realPharmacies = [];
        this.isGpsLoading = false;
      }

      init() {
        this.navigateTo('home');
      }

      navigateTo(view) {
        this.currentView = view;
        document.getElementById('header-title').textContent = `Allo Ramia - ${view.charAt(0).toUpperCase() + view.slice(1)}`;
        
        ['home', 'search', 'ordo', 'sos', 'panier', 'conseils', 'compte'].forEach(v => {
          const btn = document.getElementById(`nav-btn-${v}`);
          if (btn) {
            if (v === view) {
              btn.className = "flex flex-col items-center py-1 px-3 text-[#6B125C] font-bold transition";
            } else {
              btn.className = "flex flex-col items-center py-1 px-3 text-slate-400 hover:text-[#6B125C] font-medium transition";
            }
          }
        });

        const container = document.getElementById('view-container');
        
        if (view === 'home') {
          container.innerHTML = this.renderHomeView();
          setTimeout(() => {
            this.initMap();
            if (this.realPharmacies.length > 0) {
              this.updateMapAndCards();
            } else {
              this.getCurrentGPSLocation();
            }
          }, 100);
        } else if (view === 'search') {
          container.innerHTML = this.renderSearchView();
          setTimeout(() => {
            this.updateMapAndCards();
          }, 100);
        } else if (view === 'ordo') {
          container.innerHTML = this.renderOrdoView();
        } else if (view === 'sos') {
          container.innerHTML = this.renderSosView();
        } else if (view === 'panier') {
          container.innerHTML = this.renderPanierView();
        } else if (view === 'conseils') {
          container.innerHTML = this.renderConseilsView();
        } else if (view === 'compte') {
          container.innerHTML = this.renderCompteView();
        }
      }

        return `

              <h2 class="text-2xl sm:text-3xl font-extrabold mb-2">Trouvez vos médicaments à proximité.</h2>
              <p class="text-sm text-pink-100 mb-2">Localisation satellitaire automatique de votre position en accès libre.</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
              <div class="lg:col-span-2 bg-white rounded-2xl border border-brand-border p-4 shadow-sm">

                  <h3 class="font-bold text-slate-800 text-sm">Carte des Officines Autour de Vous</h3>
                  <button onclick="window.app.getCurrentGPSLocation()" class="text-xs bg-pink-50 text-[#6B125C] hover:bg-pink-100 px-3 py-1.5 rounded-lg font-semibold transition">
                    <i class="fa-solid fa-crosshairs mr-1"></i> Actualiser ma position
                  </button>
                </div>

                    <span class="font-bold text-xs tracking-wider uppercase bg-red-700/60 px-2.5 py-1 rounded-lg">🚨 URGENCE SANTÉ 24H/24</span>
                    <span class="text-[10px] bg-red-800 px-2 py-0.5 rounded-full font-mono">DIRECT</span>
                  </div>
                  <p class="text-xs text-red-100 leading-relaxed">
                    Besoin d'aide immédiate pour trouver un médicament urgent ou une officine ouverte à Yaoundé / Douala ?
                  </p>
                </div>
                <a href="tel:+237677550909" class="w-full bg-white text-red-700 font-bold py-3 rounded-xl text-xs shadow hover:bg-red-50 transition block text-center">
                  <i class="fa-solid fa-phone-volume mr-2"></i> Appeler +237 677 550 909
                </a>

            </div>

            <div class="bg-white rounded-2xl border border-brand-border p-6 shadow-sm mt-8">
              <h3 class="font-bold text-slate-800 text-base mb-4">Pharmacies détectées autour de vous</h3>
              <div id="pharmacies-grid" class="space-y-4">
                <p class="text-xs text-slate-400 italic">Recherche des pharmacies proches en cours via GPS...</p>
              </div>
            </div>
          </div>
        `;
      }

      renderSearchView() {
        return `
          <div class="space-y-8">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-brand-border space-y-4">
              <h2 class="text-lg font-bold text-[#6B125C]">Recherche & Pharmacies</h2>
              
              <div class="flex gap-2">
                <input type="text" id="search-input" placeholder="Rechercher un médicament (ex: Paracétamol, Amoxicilline...)" class="flex-1 px-4 py-2.5 text-xs border border-slate-200 rounded-xl focus:outline-none focus:border-[#6B125C]">
                <button onclick="window.app.performSearch()" class="bg-[#6B125C] text-white px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-[#851264] transition">Rechercher</button>
              </div>

              <div class="border border-dashed border-pink-300 rounded-2xl p-4 bg-pink-50/40 text-center space-y-2">
                <p class="text-[11px] text-slate-600 font-medium">🎤 En urgence la nuit ? Parlez pour rechercher un médicament :</p>
                <button onclick="window.app.toggleVoiceRecord()" id="voice-btn" class="w-full bg-[#6B125C] text-white font-bold py-3 rounded-xl text-xs shadow hover:bg-[#851264] transition flex items-center justify-center space-x-2">
                  <i class="fa-solid fa-microphone"></i>
                  <span id="voice-btn-text">Appuyer pour parler (Reconnaissance Vocale)</span>
                </button>
              </div>

              <div class="border border-brand-border rounded-xl p-4 bg-slate-50 flex items-center justify-between">
                <div>
                  <div class="flex items-center space-x-2">
                    <span class="text-xs font-bold text-[#6B125C]">🔄 Sync API Stock Officines (LGO) :</span>
                  </div>
                  <p class="text-[11px] text-slate-500 mt-0.5">Interrogation en direct de la base de données des pharmacies.</p>
                </div>
                <span class="px-3 py-1 bg-emerald-100 text-emerald-800 font-bold text-xs rounded-full">Actif</span>
              </div>

              <button onclick="window.app.activateGpsAndRedirect()" id="gps-action-btn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3.5 rounded-xl text-xs shadow-md transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-location-crosshairs"></i>
                <span id="gps-btn-text">Géolocalisation active (GPS Réel)</span>
              </button>
            </div>

            <div class="bg-white rounded-2xl border border-brand-border p-6 shadow-sm mt-8">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-slate-800 text-base">Pharmacies de garde à proximité :</h3>
                <span id="gps-status-badge" class="px-3 py-1 bg-emerald-100 text-emerald-800 font-bold text-xs rounded-full border border-emerald-200">${this.realPharmacies.length} Pharmacie(s) trouvée(s)</span>
              </div>
              <div id="search-pharmacies-grid" class="space-y-4">
                <p class="text-xs text-slate-400 italic">Activez la géolocalisation pour afficher la liste interactive des pharmacies de garde à Douala / Yaoundé.</p>
              </div>
            </div>
          </div>
        `;
      }

      toggleVoiceRecord() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        
        if (!SpeechRecognition) {
          alert("La reconnaissance vocale n'est pas supportée par votre navigateur. Veuillez utiliser Google Chrome.");
          return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'fr-FR';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const btnText = document.getElementById('voice-btn-text');
        const btn = document.getElementById('voice-btn');
        const searchInput = document.getElementById('search-input');

        btnText.textContent = "🔴 Écoute en cours... Parlez maintenant";
        btn.className = "w-full bg-red-600 text-white font-bold py-3 rounded-xl text-xs shadow animate-pulse flex items-center justify-center space-x-2";

        recognition.start();

        recognition.onresult = (event) => {
          const speechToText = event.results[0][0].transcript;
          if (searchInput) {
            searchInput.value = speechToText;
          }
          btnText.textContent = `✅ Texte détecté : "${speechToText}"`;
          btn.className = "w-full bg-emerald-600 text-white font-bold py-3 rounded-xl text-xs shadow flex items-center justify-center space-x-2";
          
          setTimeout(() => {
            btnText.textContent = "Appuyer pour parler (Reconnaissance Vocale)";
            btn.className = "w-full bg-[#6B125C] text-white font-bold py-3 rounded-xl text-xs shadow hover:bg-[#851264] transition flex items-center justify-center space-x-2";
          }, 3000);
        };

        recognition.onerror = (event) => {
          console.error("Erreur de reconnaissance vocale", event.error);
          btnText.textContent = "❌ Erreur d'écoute. Réessayez.";
          btn.className = "w-full bg-amber-600 text-white font-bold py-3 rounded-xl text-xs shadow flex items-center justify-center space-x-2";
          
          setTimeout(() => {
            btnText.textContent = "Appuyer pour parler (Reconnaissance Vocale)";
            btn.className = "w-full bg-[#6B125C] text-white font-bold py-3 rounded-xl text-xs shadow hover:bg-[#851264] transition flex items-center justify-center space-x-2";
          }, 3000);
        };
      }

      performSearch() {
        const input = document.getElementById('search-input');
        if (input && input.value.trim() !== "") {
          alert(`Recherche en cours pour le produit : "${input.value}" dans les officines connectées.`);
        } else {
          alert("Veuillez saisir ou dicter le nom d'un médicament.");
        }
      }

      activateGpsAndRedirect() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            this.currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            this.fetchNearbyPharmaciesOSM(this.currentLocation.lat, this.currentLocation.lng, () => {
              this.navigateTo('home');
            });
          }, () => {
            alert("Impossible d'obtenir votre position GPS précise. Utilisation de la position par défaut (Yaoundé).");
            this.fetchNearbyPharmaciesOSM(3.8480, 11.5021, () => {
              this.navigateTo('home');
            });
          }, { enableHighAccuracy: true });
        } else {
          alert("La géolocalisation n'est pas supportée par votre navigateur.");
        }
      }

      renderOrdoView() {
        return `
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-brand-border space-y-4 text-center">
            <div class="w-16 h-16 bg-pink-50 text-[#6B125C] rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">

      renderConseilsView() {
        return `

            <div class="border border-brand-border rounded-xl p-4 bg-pink-50/50 flex items-center space-x-3">
              <div class="w-10 h-10 rounded-lg bg-[#6B125C] text-white flex items-center justify-center text-lg shadow">

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-brand-border space-y-4">
              <h3 class="text-base font-bold text-slate-800 flex items-center">
                <i class="fa-solid fa-triangle-exclamation text-red-600 mr-2"></i> Fiches de Premiers Secours (Offline)
              </h3>

              <div class="border border-red-200 rounded-2xl p-4 bg-red-50/30 space-y-2">
                <h4 class="text-xs font-bold text-red-700 flex items-center">
                  <i class="fa-solid fa-bell mr-2 animate-bounce"></i> Convulsions ou Fièvre Violente de Nuit
                </h4>
                <ol class="list-decimal list-inside text-xs text-slate-700 space-y-1">
                  <li>Déshabiller l'enfant.</li>
                  <li>Appliquer un linge humide sur le front.</li>
                  <li>Administrer un suppositoire de Paracétamol.</li>
                </ol>
              </div>

              <div class="border border-amber-200 rounded-2xl p-4 bg-amber-50/30 space-y-2">
                <h4 class="text-xs font-bold text-amber-800 flex items-center">
                  <i class="fa-solid fa-triangle-exclamation mr-2"></i> Étouffement / Fausse Route
                </h4>
                <p class="text-xs text-slate-700">Méthode de Mohnson/Back blows : 5 clapses entre les omoplates.</p>
              </div>
            </div>
          </div>
        `;
      }

      renderCompteView() {
        return `
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-brand-border space-y-4">
            <h2 class="text-lg font-bold text-[#6B125C]">Espace Utilisateur & Profil</h2>
            <p class="text-xs text-slate-500">Mode Accès Libre activé. Toutes les fonctionnalités de géolocalisation et d'urgence sont pleinement opérationnelles.</p>
            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-2">
              <p><strong>Plateforme :</strong> Allo Ramia - AfricaB2B Sarl</p>
              <p><strong>Siège :</strong> Kotto, Douala - Cameroun</p>
              <p><strong>Support :</strong> +237 677 550 909</p>
            </div>
          </div>
        `;
      }

      initMap() {
        const container = document.getElementById('osm-map');
        if (!container) return;
        this.map = L.map('osm-map').setView([this.currentLocation.lat, this.currentLocation.lng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(this.map);
      }

      getCurrentGPSLocation() {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(pos => {
            this.currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            this.fetchNearbyPharmaciesOSM(this.currentLocation.lat, this.currentLocation.lng);
          }, () => {
            this.fetchNearbyPharmaciesOSM(3.8480, 11.5021);
          }, { enableHighAccuracy: true });
        } else {
          this.fetchNearbyPharmaciesOSM(3.8480, 11.5021);
        }
      }

      async fetchNearbyPharmaciesOSM(lat, lng, callback = null) {
        const radius = 5000;
        const query = `[out:json];node(around:${radius},${lat},${lng})[amenity=pharmacy];out;`;
        const url = `https://overpass-api.de/api/interpreter?data=` + encodeURIComponent(query);

        try {
          const response = await fetch(url);
          const data = await response.json();
          
          if (data && data.elements) {
            this.realPharmacies = data.elements.map(el => {
              const name = el.tags && el.tags.name ? el.tags.name : "Pharmacie (Nom non renseigné)";
              const rawPhone = el.tags && (el.tags.phone || el.tags['contact:phone'] || el.tags['phone:mobile']);
              const phone = rawPhone ? rawPhone : null;
              
              const street = el.tags && el.tags['addr:street'] ? el.tags['addr:street'] : "";
              const suburb = el.tags && (el.tags['addr:suburb'] || el.tags['addr:quarter'] || el.tags.suburb) ? el.tags['addr:suburb'] || el.tags['addr:quarter'] || el.tags.suburb : "";
              const city = el.tags && el.tags['addr:city'] ? el.tags['addr:city'] : "Yaoundé";

              let fullAddress = [street, suburb, city].filter(Boolean).join(", ");
              if (!fullAddress) fullAddress = "Avenue / Rue principale à proximité";

              const R = 6371;
              const dLat = (el.lat - lat) * Math.PI / 180;
              const dLon = (el.lon - lng) * Math.PI / 180;
              const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                        Math.cos(lat * Math.PI / 180) * Math.cos(el.lat * Math.PI / 180) * 
                        Math.sin(dLon/2) * Math.sin(dLon/2);
              const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
              const distance = R * c;

              return { id: el.id, name, phone, address: fullAddress, lat: el.lat, lng: el.lon, distance };
            }).sort((a, b) => a.distance - b.distance);

            this.updateMapAndCards();
            if (callback) callback();
          }
        } catch (e) {
          console.error("Erreur Overpass API", e);
          if (callback) callback();
        }
      }

      updateMapAndCards() {
        if (this.currentView === 'home' && this.map) {
          this.map.setView([this.currentLocation.lat, this.currentLocation.lng], 15);
          if (this.userMarker) this.map.removeLayer(this.userMarker);
          this.userMarker = L.circleMarker([this.currentLocation.lat, this.currentLocation.lng], {
            radius: 9, fillColor: "#A1197A", color: "#FFF", weight: 2, fillOpacity: 0.9
          }).addTo(this.map).bindPopup("📍 Votre position actuelle (GPS)").openPopup();

          this.mapMarkers.forEach(m => this.map.removeLayer(m));
          this.mapMarkers = [];

          this.realPharmacies.forEach(p => {
            const marker = L.marker([p.lat, p.lng]).addTo(this.map);
            marker.bindPopup(`
              <div class="p-1">
                <strong class="text-xs text-[#6B125C]">${p.name}</strong><br/>
                <span class="text-[10px] text-emerald-600 font-bold">À ${p.distance.toFixed(1)} km</span><br/>
                <span class="text-[10px] text-slate-500">${p.address}</span>
              </div>
            `);
            this.mapMarkers.push(marker);
          });
        }

        const gridHome = document.getElementById('pharmacies-grid');
        const gridSearch = document.getElementById('search-pharmacies-grid');
        const badge = document.getElementById('gps-status-badge');
        if (badge) {
          badge.textContent = `${this.realPharmacies.length} Pharmacie(s) trouvée(s)`;
        }
        
        const htmlCards = this.realPharmacies.length === 0 ? 
          `<p class="text-xs text-slate-500 italic">Aucune pharmacie enregistrée à proximité immédiate.</p>` :
          this.realPharmacies.map(p => {
            const mapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${this.currentLocation.lat},${this.currentLocation.lng}&destination=${p.lat},${p.lng}&travelmode=driving`;
            
            return `
              <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hover:border-[#6B125C] transition space-y-4">
                <div class="flex items-start justify-between">
                  <div>
                    <div class="flex items-center space-x-2">
                      <span class="text-base">💊</span>
                      <h4 class="font-bold text-[#6B125C] text-sm sm:text-base">${p.name}</h4>
                    </div>
                    <p class="text-xs text-slate-600 mt-1">
                      <strong class="text-slate-700">Adresse :</strong> ${p.address}
                    </p>
                    <p class="text-xs text-slate-500 mt-0.5">
                      <strong class="text-slate-700">Tél :</strong> ${p.phone ? `<a href="tel:${p.phone}" class="text-emerald-700 font-bold hover:underline">${p.phone}</a>` : '<span class="italic text-slate-400">Numéro non vérifié (Officine non affiliée)</span>'}
                    </p>
                    <p class="text-[11px] text-slate-400 mt-0.5">✓ Coordonnées GPS : (${p.lat.toFixed(4)}, ${p.lng.toFixed(4)})</p>
                  </div>
                  <span class="px-3 py-1 bg-emerald-50 text-emerald-700 font-bold text-xs rounded-full border border-emerald-200 shrink-0">
                    À ${p.distance < 1 ? Math.round(p.distance * 1000) + ' m' : p.distance.toFixed(1) + ' km'}
                  </span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-100">
                  ${p.phone ? `
                    <a href="tel:${p.phone}" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-xs transition text-center flex items-center justify-center space-x-2">
                      <i class="fa-solid fa-phone text-emerald-600"></i>
                      <span>Appeler l'Officine</span>
                    </a>
                  ` : `
                    <div class="w-full bg-slate-100 text-slate-400 font-medium py-2.5 rounded-xl text-xs text-center flex items-center justify-center space-x-2">
                      <i class="fa-solid fa-phone-slash"></i>
                      <span>Ligne non enregistrée</span>
                    </div>
                  `}

                  <a href="${mapsUrl}" target="_blank" class="w-full bg-[#6B125C] hover:bg-[#851264] text-white font-bold py-2.5 rounded-xl text-xs shadow transition text-center flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span>Itinéraire GPS</span>
                  </a>
                </div>
              </div>
            `;
          }).join('');

        if (gridHome) gridHome.innerHTML = htmlCards;
        if (gridSearch) gridSearch.innerHTML = htmlCards;
      }
    }

    window.app = new AlloRamiaApp();
    window.onload = () => { window.app.init(); };
  </script>
</body>
